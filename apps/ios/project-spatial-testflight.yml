# A separate generated project prevents a normal `xcodegen generate` / App Store
# archive from silently picking up an unfinished experiment. Both projects still
# identify as Rendprop; only this explicit TestFlight artifact exposes local capture.
include:
  - project.yml
name: RendpropSpatialTestFlight
settings:
  base:
    # Background property video and guided capture update. Normal project remains74.
    # Recheck Apple inventory; never automatically renumber an upload retry.
    CURRENT_PROJECT_VERSION: "79"
targets:
  Rendprop:
    sources:
      - path: ../../tools/spatial-spike/capture-ios/Sources/StationCaptureModels.swift
      - path: ../../tools/spatial-spike/capture-ios/Sources/StationCapturePolicy.swift
      - path: ../../tools/spatial-spike/capture-ios/Sources/StationCaptureRecorder.swift
      - path: ../../tools/spatial-spike/capture-ios/Sources/PanoramaProjection.swift
      - path: ../../tools/spatial-spike/capture-ios/Sources/PanoramaRenderer.swift
      - path: ../../tools/spatial-spike/capture-ios/Sources/PanoramaPreviewViewController.swift
      - path: ../../tools/spatial-spike/capture-ios/Sources/RoomScanPlanner.swift
      - path: ../../tools/spatial-spike/capture-ios/Sources/PanoramaNavigationPolicy.swift
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SPATIAL_CAPTURE_LAB"
  RendpropUITests:
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SPATIAL_CAPTURE_LAB"
schemes:
  RendpropSpatialTestFlight:
    build:
      targets:
        Rendprop: all
        RendpropUITests: [test]
    run:
      config: Release
    test:
      config: Release
      targets:
        - RendpropUITests
      captureScreenshotsAutomatically: false
    archive:
      config: Release
