name: Rendprop
options:
  bundleIdPrefix: com.rendprop
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "5F5C5G25Y6"   # Aaron Pilkington — real Team ID (OU= from signing cert)
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Rendprop/Info.plist
    ENABLE_USER_SCRIPT_SANDBOXING: YES
# NOTE: TUSKit (tus resumable-upload client) is intentionally NOT included yet —
# the .direct (presigned PUT) and .simulate upload modes cover Phase 1 with zero
# third-party dependencies and zero build risk. Add when a tus server exists:
# packages:
#   TUSKit:
#     url: https://github.com/tus/TUSKit
#     from: 3.4.0
targets:
  Rendprop:
    type: application
    platform: iOS
    sources:
      - path: Rendprop
        excludes:
          - "Resources/player/**"
          # SECURITY: never bundle local secrets into the .app. The legacy
          # direct-AI-provider path was removed (audit 2026-08-26); all AI
          # calls go through the Supabase edge functions.
          - "Resources/Secrets.plist"
          - "**/Secrets.plist"
          # Don't ship the placeholder example either — it leaks provider/model names.
          - "Resources/Secrets.example.plist"
          - "**/Secrets.example.plist"
      # Bundled as a FOLDER reference ("player/"): everything inside ships as-is,
      # so `index.html` and the optional `demo.mp4` (untracked — see
      # apps/web/player/README.md for the recipe) need no per-file entries. The
      # app copes when demo.mp4 is absent (explicit "Sample video unavailable").
      # Runtime folders (Documents/Recordings, Imports, Aerials, Previews…) are
      # created on device and need nothing here.
      - path: Rendprop/Resources/player
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rendprop.app
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Rendprop/Rendprop.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # ---------------------------------------------------------------------------
  # UI walk (docs/LAUNCH-CONTRACT.md § UI walk). ONE XCUITest that launches the
  # app with `-uiTesting` (MockAPIClient — no network, no live backend, no real
  # customer data) and attaches a keepAlways screenshot of every main screen.
  # A test bundle is only ever installed by `xcodebuild test`; it is never part
  # of an archive, so nothing here reaches the App Store build.
  RendpropUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RendpropUITests
        excludes:
          - "README.md"        # how to run it — documentation, not a bundle resource
          - "bridge-cmd-*.sh"  # bridge command blocks — shell, not a bundle resource
          - "bridge-cmd-uiwalk.sh"   # runs on the Mac bridge; never part of the bundle
    dependencies:
      - target: Rendprop
    settings:
      base:
        TEST_TARGET_NAME: Rendprop
        PRODUCT_BUNDLE_IDENTIFIER: com.rendprop.app.uitests
        # The project-wide `settings.base` above points EVERY target at the
        # app's real Info.plist. A test bundle must generate its own, and an
        # inherited INFOPLIST_FILE beats the generator — so both keys are
        # overridden here. Empty string = "no plist file", the generator wins.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5F5C5G25Y6"   # same team as the app target
        TARGETED_DEVICE_FAMILY: "1"      # iPhone only, like the app

# Explicit shared scheme so the bridge's `-scheme Rendprop` is deterministic
# (before this it relied on Xcode auto-creating one at open time) and so
# `-only-testing:RendpropUITests` has a test action to attach to.
schemes:
  Rendprop:
    build:
      targets:
        Rendprop: all
        RendpropUITests: [test]
    run:
      config: Debug
      # Simulator purchases use the local StoreKit configuration (six
      # auto-renewable products in `rendprop_plans`); on device StoreKit talks
      # to App Store Connect / the sandbox instead. The file lives next to
      # project.yml, outside the sources path, so it is never bundled.
      storeKitConfiguration: Rendprop.storekit
    test:
      config: Debug
      targets:
        - RendpropUITests
      # Only the screenshots the walk names are attached. Xcode's automatic
      # per-step capture would bury `01-home` … `09-health-probe` in hundreds
      # of unnamed PNGs at export time.
      captureScreenshotsAutomatically: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
