name: WebCodecs audible fixture and fault controls (partial evidence only)

# Evidence draft. The release owner may install it at
# .github/workflows/per-composite-capture-diagnostic.yml on a separate
# diagnostic branch and dispatch the registered workflow once.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-147-webcodecs-audible-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  webcodecs-audible-proof:
    name: Three-second audible original proof plus fault controls — NOT required CI
    if: github.repository == 'AaronPilk/RendProp-Ai' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SHIPPING_SHA: 1c561d7b91d9b75bd7ba29aa081fcba959089fee
      DIAGNOSTIC_SHA: ${{ github.sha }}
    steps:
      - name: Set proof evidence path from runner environment
        shell: bash
        run: |
          set -euo pipefail
          printf 'PROOF_BASE=%s/rendprop-webcodecs-audible-proof\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout exact shipping source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 1c561d7b91d9b75bd7ba29aa081fcba959089fee
          path: shipping
          persist-credentials: false

      - name: Checkout only diagnostic payload and workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            tools/ci/audible-proof-payloads

      - name: Pin identities and retain source hashes before setup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C shipping rev-parse HEAD)" = "$SHIPPING_SHA"
          test "$(git -C diagnostic rev-parse HEAD)" = "$DIAGNOSTIC_SHA"
          test -f diagnostic/.github/workflows/per-composite-capture-diagnostic.yml
          test -f diagnostic/tools/ci/audible-proof-payloads/hosted_audible.py
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          files = (
              'shipping/.github/workflows/ci.yml',
              'shipping/apps/studio/package-lock.json',
              'shipping/apps/studio/tests/cloud-editor-browser.mjs',
              'shipping/apps/studio/src/editor/export.ts',
              'shipping/apps/studio/src/editor/mp4-cadence.ts',
              'diagnostic/.github/workflows/per-composite-capture-diagnostic.yml',
              'diagnostic/tools/ci/audible-proof-payloads/hosted_audible.py',
          )
          record = {
              'schema': 'rendprop-147-webcodecs-audible-ci-context-v1',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'event': os.environ['GITHUB_EVENT_NAME'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'shipping_sha': os.environ['SHIPPING_SHA'],
              'diagnostic_sha': os.environ['DIAGNOSTIC_SHA'],
              'runner_label': 'macos-26',
              'image_os': os.environ.get('ImageOS'),
              'image_version': os.environ.get('ImageVersion'),
              'source_hashes': {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in files},
              'scope': 'One synthetic three-second audible-original proof: two positive and eight refusal cases; NOT required CI/full feature parity. No provider, account, deployment or release-source edit.',
          }
          base = Path(os.environ['PROOF_BASE']); base.mkdir(mode=0o700)
          out = base / 'context.json'
          with out.open('x') as file:
              json.dump(record, file, indent=2)
              file.write('\n')
          out.chmod(0o600)
          PY

      - name: Set up locked Studio Node and npm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: shipping/apps/studio/package-lock.json

      - name: Install locked Studio dependencies
        working-directory: shipping/apps/studio
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.23.4
          npm ci --ignore-scripts 2>&1 | tee "$PROOF_BASE/studio-dependency-install.log"
          studio_audit_status=0
          npm audit --json > "$PROOF_BASE/studio-dependency-audit.json" || studio_audit_status=$?
          printf '%s\n' "$studio_audit_status" > "$PROOF_BASE/studio-dependency-audit.exitcode"
          STUDIO_AUDIT_EXIT="$studio_audit_status" node --input-type=module - <<'JSAUDIT'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.env.PROOF_BASE + '/studio-dependency-audit.json', 'utf8'));
          if (![0, 1].includes(Number(process.env.STUDIO_AUDIT_EXIT)) || report.error ||
              !report.metadata?.vulnerabilities || !report.vulnerabilities)
            throw new Error('Full Studio audit did not produce a valid advisory report.');
          JSAUDIT
          # Preserve the shipping security policy; the full dev audit is evidence.
          npm audit --omit=dev --audit-level=high --json > "$PROOF_BASE/studio-production-audit.json"

      - name: Install and audit pinned external proof dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.23.4
          python3 - <<'PYSETUP'
          import os, shutil
          from pathlib import Path
          source=Path(os.environ['GITHUB_WORKSPACE'])/'diagnostic/tools/ci/audible-proof-payloads/dependencies'
          dest=Path(os.environ['PROOF_BASE'])/'dependencies'
          shutil.copytree(source,dest)
          PYSETUP
          cd "$PROOF_BASE/dependencies"
          npm ci --ignore-scripts --no-audit 2>&1 | tee "$PROOF_BASE/dependency-install.log"
          npm audit --audit-level=low --json > "$PROOF_BASE/dependency-audit.json"

      - name: Validate bounded readiness controls
        shell: bash
        run: |
          set -euo pipefail
          python3 diagnostic/tools/ci/audible-proof-payloads/hosted_audible_controls.py
          node --test shipping/tools/ci/media-runner-ready.test.mjs

      # The normal cache is bound to its run ID and cannot cross into this
      # workflow. Install the same locked tools before bounded readiness.
      - name: Prepare exact Chromium and FFmpeg before timing admission
        working-directory: shipping/apps/studio
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install chromium --no-shell
          browser_path="$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath());")"
          test -x "$browser_path"
          browser_app="${browser_path%/Contents/MacOS/*}"
          browser_signature="$(/usr/bin/codesign --display --verbose=4 "$browser_app" 2>&1)"
          printf '%s\n' "$browser_signature" | node ../../tools/ci/browser-signature-policy.mjs --executable "$browser_path"
          /usr/bin/codesign --verify --deep --strict --ignore-resources "$browser_app"
          test "$("$browser_path" --version | sed 's/[[:space:]]*$//')" = "Google Chrome for Testing 153.0.8010.12"
          if ! test -x /opt/homebrew/bin/ffmpeg || ! test -x /opt/homebrew/bin/ffprobe; then
            /opt/homebrew/bin/brew install ffmpeg
          fi
          /usr/bin/codesign --verify --strict /opt/homebrew/bin/ffmpeg
          /usr/bin/codesign --verify --strict /opt/homebrew/bin/ffprobe
          test "$(/opt/homebrew/bin/ffmpeg -version | sed -n '1p')" = "ffmpeg version 9.0.2 Copyright (c) 2000-2026 the FFmpeg developers"
          test "$(/opt/homebrew/bin/ffprobe -version | sed -n '1p')" = "ffprobe version 9.0.2 Copyright (c) 2007-2026 the FFmpeg developers"
          printf 'STUDIO_BROWSER_EXECUTABLE=%s\n' "$browser_path" >> "$GITHUB_ENV"
          printf '/opt/homebrew/bin\n' >> "$GITHUB_PATH"

      - name: Record actual media-test runtime and runner load
        shell: bash
        run: |
          set -euo pipefail
          # Shipping setup uses Node 22; Homebrew takes precedence later.
          test "$(node --version)" = v24.22.2
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          import os from 'node:os';
          const facts = {
            schema: 'rendprop-147-webcodecs-audible-ci-runner-v1',
            capturedAtUTC: new Date().toISOString(),
            platform: process.platform, arch: process.arch,
            nodeVersion: process.version, cpus: os.cpus().length,
            totalmem: os.totalmem(), freemem: os.freemem(),
            loadavg: os.loadavg(),
            browserExecutable: process.env.STUDIO_BROWSER_EXECUTABLE,
            audioOutput: 'default-device',
            imageOS: process.env.ImageOS ?? null,
            imageVersion: process.env.ImageVersion ?? null,
            equivalenceLimit: 'Vendor preparation precedes readiness on this runner; frozen audible fixture uses default AudioContext/headless launch, without shipping audio-output observer.',
          };
          if (facts.platform !== 'darwin' || facts.arch !== 'arm64' || facts.cpus !== 3)
            throw new Error('Hosted runner differs from the failed three-CPU macOS runner.');
          writeFileSync(process.env.PROOF_BASE + '/runner-facts.json',
            JSON.stringify(facts, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          JS

      - name: Archive immutable source and prepare disposable prototype
        shell: bash
        run: |
          set -euo pipefail
          python3 diagnostic/tools/ci/audible-proof-payloads/hosted_audible.py prepare \
            --shipping-root "$GITHUB_WORKSPACE/shipping" \
            --base-dir "$PROOF_BASE"
          node --check "$PROOF_BASE/source/apps/studio/tests/audible-proof-browser.mjs"

      - name: Require unchanged bounded media readiness
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          node shipping/tools/ci/media-runner-ready.mjs --output "$PROOF_BASE/readiness.json"

      - name: Run exactly one partial audible suite with default-device audio
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 diagnostic/tools/ci/audible-proof-payloads/hosted_audible.py run \
            --shipping-root "$GITHUB_WORKSPACE/shipping" \
            --base-dir "$PROOF_BASE" \
            --node "$(command -v node)" \
            --browser "$STUDIO_BROWSER_EXECUTABLE"

      - name: Retain partial proof evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-webcodecs-audible-partial-proof-147-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/context.json
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/runner-facts.json
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/readiness.json
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/preparation-journal.json
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/prepared-manifest.json
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/source-freeze.json
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/studio-dependency-install.log
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/studio-dependency-audit.json
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/studio-dependency-audit.exitcode
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/studio-production-audit.json
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/dependency-audit.json
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/dependency-install.log
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/dependencies/package.json
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/dependencies/package-lock.json
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/run-1/journal.json
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/run-1/run.log
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/run-1/artifacts/rendprop-audible-webcodecs-*/receipt.json
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/run-1/artifacts/rendprop-audible-webcodecs-*/*.png
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/run-1/artifacts/rendprop-audible-webcodecs-*/*.mp4
            ${{ runner.temp }}/rendprop-webcodecs-audible-proof/run-1/artifacts/rendprop-audible-webcodecs-*/*.wav
          retention-days: 7
          if-no-files-found: warn
