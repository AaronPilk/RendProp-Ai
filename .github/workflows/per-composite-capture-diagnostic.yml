name: Passive Studio capture diagnostic (evidence only)

# Evidence draft. The release owner may install it at
# .github/workflows/per-composite-capture-diagnostic.yml on a separate
# diagnostic branch and dispatch the registered workflow once.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-147-passive-studio-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  passive-narrated-export:
    name: First narrated Studio export, passive observations
    if: github.repository == 'AaronPilk/RendProp-Ai'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      SHIPPING_SHA: 1c561d7b91d9b75bd7ba29aa081fcba959089fee
      DIAGNOSTIC_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact shipping source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 1c561d7b91d9b75bd7ba29aa081fcba959089fee
          path: shipping
          persist-credentials: false

      - name: Checkout only diagnostic payload and workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            tools/ci/passive-studio-export

      - name: Pin identities and retain source hashes before setup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C shipping rev-parse HEAD)" = "$SHIPPING_SHA"
          test "$(git -C diagnostic rev-parse HEAD)" = "$DIAGNOSTIC_SHA"
          test -f diagnostic/.github/workflows/per-composite-capture-diagnostic.yml
          test -f diagnostic/tools/ci/passive-studio-export/prepare_diagnostic_copy.py
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          files = (
              'shipping/.github/workflows/ci.yml',
              'shipping/apps/studio/package-lock.json',
              'shipping/apps/studio/tests/cloud-editor-browser.mjs',
              'shipping/apps/studio/src/editor/export.ts',
              'shipping/apps/studio/src/editor/mp4-cadence.ts',
              'diagnostic/.github/workflows/per-composite-capture-diagnostic.yml',
              'diagnostic/tools/ci/passive-studio-export/prepare_diagnostic_copy.py',
          )
          record = {
              'schema': 'rendprop-147-passive-ci-context-v1',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'event': os.environ['GITHUB_EVENT_NAME'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'shipping_sha': os.environ['SHIPPING_SHA'],
              'diagnostic_sha': os.environ['DIAGNOSTIC_SHA'],
              'runner_label': 'macos-26',
              'image_os': os.environ.get('ImageOS'),
              'image_version': os.environ.get('ImageVersion'),
              'source_hashes': {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in files},
              'scope': 'One synthetic-media workflow_dispatch diagnostic; no provider, production account or deployment.',
          }
          out = Path(os.environ['RUNNER_TEMP']) / 'studio-media-diagnostic-context.json'
          with out.open('x') as file:
              json.dump(record, file, indent=2)
              file.write('\n')
          out.chmod(0o600)
          PY

      - name: Set up locked Studio Node and npm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: shipping/apps/studio/package-lock.json

      - name: Install locked Studio dependencies
        working-directory: shipping/apps/studio
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.23.4
          npm ci --ignore-scripts

      - name: Validate bounded readiness controls
        shell: bash
        run: |
          set -euo pipefail
          node --test shipping/tools/ci/media-runner-ready.test.mjs

      # The normal cache is bound to its run ID and cannot cross into this
      # workflow. Install the same locked tools before bounded readiness.
      - name: Prepare exact Chromium and FFmpeg before timing admission
        working-directory: shipping/apps/studio
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install chromium --no-shell
          browser_path="$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath());")"
          test -x "$browser_path"
          browser_app="${browser_path%/Contents/MacOS/*}"
          browser_signature="$(/usr/bin/codesign --display --verbose=4 "$browser_app" 2>&1)"
          printf '%s\n' "$browser_signature" | node ../../tools/ci/browser-signature-policy.mjs --executable "$browser_path"
          /usr/bin/codesign --verify --deep --strict --ignore-resources "$browser_app"
          test "$("$browser_path" --version | sed 's/[[:space:]]*$//')" = "Google Chrome for Testing 153.0.8010.12"
          if ! test -x /opt/homebrew/bin/ffmpeg || ! test -x /opt/homebrew/bin/ffprobe; then
            /opt/homebrew/bin/brew install ffmpeg
          fi
          /usr/bin/codesign --verify --strict /opt/homebrew/bin/ffmpeg
          /usr/bin/codesign --verify --strict /opt/homebrew/bin/ffprobe
          test "$(/opt/homebrew/bin/ffmpeg -version | sed -n '1p')" = "ffmpeg version 9.0.2 Copyright (c) 2000-2026 the FFmpeg developers"
          test "$(/opt/homebrew/bin/ffprobe -version | sed -n '1p')" = "ffprobe version 9.0.2 Copyright (c) 2007-2026 the FFmpeg developers"
          printf 'STUDIO_BROWSER_EXECUTABLE=%s\n' "$browser_path" >> "$GITHUB_ENV"
          printf '/opt/homebrew/bin\n' >> "$GITHUB_PATH"

      - name: Record actual media-test runtime and runner load
        shell: bash
        run: |
          set -euo pipefail
          # Shipping setup uses Node 22; Homebrew takes precedence later.
          test "$(node --version)" = v24.22.2
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          import os from 'node:os';
          const facts = {
            schema: 'rendprop-147-passive-ci-runner-v1',
            capturedAtUTC: new Date().toISOString(),
            platform: process.platform, arch: process.arch,
            nodeVersion: process.version, cpus: os.cpus().length,
            totalmem: os.totalmem(), freemem: os.freemem(),
            loadavg: os.loadavg(),
            browserExecutable: process.env.STUDIO_BROWSER_EXECUTABLE,
            audioOutput: 'default-device',
            imageOS: process.env.ImageOS ?? null,
            imageVersion: process.env.ImageVersion ?? null,
            equivalenceLimit: 'Vendor preparation occurs on this runner before readiness, unlike shipping two-job cache preparation.',
          };
          if (facts.platform !== 'darwin' || facts.arch !== 'arm64' || facts.cpus !== 3)
            throw new Error('Hosted runner differs from the failed three-CPU macOS runner.');
          writeFileSync(process.env.RUNNER_TEMP + '/studio-media-diagnostic-runner-facts.json',
            JSON.stringify(facts, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          JS

      - name: Prepare isolated diagnostic copy
        shell: bash
        run: |
          set -euo pipefail
          python3 diagnostic/tools/ci/passive-studio-export/prepare_diagnostic_copy.py \
            --studio-root "$GITHUB_WORKSPACE/shipping/apps/studio" \
            --base-dir "$RUNNER_TEMP/rendprop-passive-diagnostic"

      - name: Require all six closed observer controls
        shell: bash
        run: |
          set -euo pipefail
          node --test "$RUNNER_TEMP/rendprop-passive-diagnostic/passive-export-diagnostics.test.mjs" \
            2>&1 | tee "$RUNNER_TEMP/rendprop-passive-diagnostic/closed-controls.log"

      - name: Require unchanged bounded recorded media readiness
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          node shipping/tools/ci/media-runner-ready.mjs \
            --output "$RUNNER_TEMP/studio-media-diagnostic-readiness.json"

      - name: Run one first narrated export with default-device audio
        working-directory: shipping/apps/studio
        timeout-minutes: 10
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/rendprop-passive-diagnostic/run_diagnostic.py" \
            --browser "$STUDIO_BROWSER_EXECUTABLE"

      - name: Summarize available evidence without changing the test verdict
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          base = temp / 'rendprop-passive-diagnostic'
          paths = {
              'context': temp / 'studio-media-diagnostic-context.json',
              'runner_facts': temp / 'studio-media-diagnostic-runner-facts.json',
              'readiness': temp / 'studio-media-diagnostic-readiness.json',
              'copy_manifest': base / 'diagnostic-copy-manifest.json',
              'run_journal': base / 'run-1/journal.json',
          }
          receipts = sorted(base.glob('run-1/artifacts/rendprop-cloud-editor-*/receipt.json'))
          summary = {
              'schema': 'rendprop-147-passive-ci-summary-v1',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'expected_shipping_sha': os.environ['SHIPPING_SHA'],
              'evidence': {},
              'browser_receipt_count': len(receipts),
          }
          for name, path in paths.items():
              if path.is_file():
                  raw = path.read_bytes()
                  summary['evidence'][name] = {
                      'sha256': hashlib.sha256(raw).hexdigest(),
                      'size_bytes': len(raw),
                  }
                  if name in ('readiness', 'run_journal'):
                      item = json.loads(raw)
                      summary['evidence'][name]['status'] = item.get('status')
          for index, path in enumerate(receipts):
              raw = path.read_bytes()
              summary['evidence'][f'browser_receipt_{index}'] = {
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'size_bytes': len(raw),
                  'status': json.loads(raw).get('status'),
              }
          out = temp / 'studio-media-diagnostic-summary.json'
          with out.open('x') as file:
              json.dump(summary, file, indent=2)
              file.write('\n')
          out.chmod(0o600)
          PY

      - name: Retain bounded runtime and export evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-passive-diagnostic-147-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/studio-media-diagnostic-context.json
            ${{ runner.temp }}/studio-media-diagnostic-runner-facts.json
            ${{ runner.temp }}/studio-media-diagnostic-readiness.json
            ${{ runner.temp }}/studio-media-diagnostic-summary.json
            ${{ runner.temp }}/rendprop-passive-diagnostic/*.json
            ${{ runner.temp }}/rendprop-passive-diagnostic/*.py
            ${{ runner.temp }}/rendprop-passive-diagnostic/*.mjs
            ${{ runner.temp }}/rendprop-passive-diagnostic/*.md
            ${{ runner.temp }}/rendprop-passive-diagnostic/*.log
            ${{ runner.temp }}/rendprop-passive-diagnostic/run-1/journal.json
            ${{ runner.temp }}/rendprop-passive-diagnostic/run-1/run.log
            ${{ runner.temp }}/rendprop-passive-diagnostic/run-1/artifacts/rendprop-cloud-editor-*/receipt.json
            ${{ runner.temp }}/rendprop-passive-diagnostic/run-1/artifacts/rendprop-cloud-editor-*/*.png
            ${{ runner.temp }}/rendprop-passive-diagnostic/run-1/artifacts/rendprop-cloud-editor-*/*.mp4
            ${{ runner.temp }}/rendprop-passive-diagnostic/run-1/artifacts/rendprop-cloud-editor-*/*.wav
          retention-days: 7
          if-no-files-found: warn
