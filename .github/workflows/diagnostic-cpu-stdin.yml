name: Diagnostic CPU rawvideo stdin protocol

on:
  push:
    branches: [diagnostic/cpu-stdin-20261017]

permissions:
  contents: read

concurrency:
  group: diagnostic-cpu-stdin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-stdin-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Same Ubuntu FFmpeg package as the failed CPU gate
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          dpkg-query -W -f='${Package} ${Version}\n' ffmpeg
      - name: Exact original dash and explicit pipe stdin, synthetic three-frame input only
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tools/audit/diagnose_cpu_stdin.py --output-dir "$RUNNER_TEMP/rendprop-cpu-stdin"
      - name: Retain bounded synthetic command, stderr and encoded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-cpu-stdin-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rendprop-cpu-stdin/**
          if-no-files-found: error
          retention-days: 7
