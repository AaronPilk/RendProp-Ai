          assert.ok(receipt.failure.includes(expected[control]));
          assert.deepEqual(receipt.errors,[]);
          assert.deepEqual(receipt.externalRequests,[]);
          NODE
          done
      - name: Recovery retains drafts and suppresses private caught errors
        run: |
          for control in clear-draft-on-reload unsafe-react-logging; do
            evidence_dir="/tmp/rendprop-studio-recovery-$control"
            mkdir -p "$evidence_dir"
            rm -f "$evidence_dir/receipt.json"
            set +e
            RENDPROP_RECOVERY_EVIDENCE="$evidence_dir" node tests/recovery-browser.mjs --fault="$control" > "$RUNNER_TEMP/recovery-$control.log" 2>&1
            control_status=$?
            set -e
            test "$control_status" -ne 0
            node --input-type=module - "$evidence_dir/receipt.json" "$control" <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const receipt=JSON.parse(readFileSync(process.argv[2],'utf8'));
          const control=process.argv[3];
          const expected={
            'clear-draft-on-reload':'An edited draft must survive explicit Reload without reseeding',
            'unsafe-react-logging':'Caught React errors must not expose private signed URLs in the browser console',
          };
          assert.equal(receipt.passed,false);
          assert.equal(receipt.fault,control);
          assert.equal(receipt.sourceBoundAtEnd,true);
          if(control==='unsafe-react-logging') assert.equal(receipt.unsafeControlCompiled,true);
          assert.ok(receipt.failure.includes(expected[control]));
          NODE
          done
      - name: Contact navigation and account isolation controls
        run: |
          for control in missing-guard missing-account-scope; do
            evidence_log="$RUNNER_TEMP/rendprop-contact-$control.log"
            set +e
            node tests/contact-navigation-browser.mjs --fault="$control" > "$evidence_log" 2>&1
            control_status=$?
            set -e
            if [ "$control_status" -eq 0 ]; then
              cat "$evidence_log"
              exit 1
            fi
            node --input-type=module - "$evidence_log" "$control" <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const receipt=JSON.parse(readFileSync(process.argv[2],'utf8'));
          const control=process.argv[3];
          const expected={
            'missing-guard':'Canceling property change must retain client A',
            'missing-account-scope':'The other account must see only the saved shared contact',
          };
          assert.equal(receipt.status,'failed');
          assert.equal(receipt.fault,control);
          assert.ok(receipt.failure.includes(expected[control]));
          assert.deepEqual(receipt.errors,[]);
          assert.deepEqual(receipt.externalRequests,[]);
          console.log(`Contact control ${control} caught at its intended assertion.`);
          NODE
          done
      - name: Explicit listing facts controls
        run: |
          for control in broad-changes normalized-baseline missing-draft; do
            evidence_log="$RUNNER_TEMP/rendprop-facts-$control.log"
            set +e
            node tests/listing-facts-browser.mjs --fault="$control" > "$evidence_log" 2>&1
            control_status=$?
            set -e
            if [ "$control_status" -eq 0 ]; then
              cat "$evidence_log"
              exit 1
            fi
            node --input-type=module - "$evidence_log" "$control" <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const receipt=JSON.parse(readFileSync(process.argv[2],'utf8'));
          const control=process.argv[3];
          const expected={
            'broad-changes':'Only changed form fields may enter the facts contract',
            'normalized-baseline':'Expected empty text must remain the raw server value',
            'missing-draft':'Property switch must recover unsaved fact fields',
          };
          assert.equal(receipt.status,'failed');
          assert.equal(receipt.fault,control);
          assert.ok(receipt.failure.includes(expected[control]));
          assert.deepEqual(receipt.errors,[]);
          assert.deepEqual(receipt.externalRequests,[]);
          console.log(`Listing facts control ${control} caught at its intended assertion.`);
          NODE
          done
      - name: Retain browser failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
