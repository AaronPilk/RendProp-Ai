        run: |
          python3 tools/audit/test_photo_export_ci_setup.py --out "$RUNNER_TEMP/rendprop-photo-export-setup-controls"
          python3 tools/audit/prepare_photo_export_ci.py --evidence-dir "$RUNNER_TEMP/rendprop-photo-export-setup-$GITHUB_RUN_ATTEMPT"
      - name: Actual UIKit JPEG exports, level crops and original-byte preservation
        run: |
          python3 tools/audit/test_photo_export_simulator_discovery.py
          python3 apps/ios/tests/run-photo-export-renderer.py --simulator "${RENDPROP_PHOTO_EXPORT_SIMULATOR:?verified CI kernel required}"
      - name: Retain actual UIKit renderer receipts and control logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
