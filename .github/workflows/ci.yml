            /tmp/rendprop-photo-delivery-browser-*/*.zip
            /tmp/rendprop-photographer-*/receipt.json
            /tmp/rendprop-photographer-*/*.png
          if-no-files-found: warn

  worker-edge:
    name: Cloudflare Worker (tour-host)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: services/edge/tour-host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/edge/tour-host/package-lock.json

      # Reproducibility: this is exactly the failure P0-8 was about — a missing
      # lockfile meant a clean install didn't resolve.
      - name: npm ci (clean, lockfile-driven)
        run: npm ci
      - name: Private measurement drafts stay out of public listing facts
        run: node --test ../../supabase/functions/tours/public-details-renderer-check.mjs

      - name: Typecheck
        run: npm run typecheck

      # The MLS compliance gate. /u/<slug> is the only URL an agent may paste
      # into an MLS unbranded virtual-tour field; those rules ban agent/broker
      # identification, contact forms, social profiles and external links, and
      # branding violations are fined (RI Statewide MLS: $50 first offence,
      # escalating). scripts/check-unbranded.mjs renders the real renderer with
      # sentinel-loaded branded fields and fails on any leak.
      - name: Unbranded (MLS-safe) page check
        run: npm test

      - name: Bundle (deploy --dry-run, no credentials needed)
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry

      # Production dependencies must be clean. Dev-tool advisories (miniflare,
      # sharp, ws) don't ship in the Worker bundle, so they don't fail the build.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Run real H.264/AAC gates in the full browser bundled with the locked
      # Playwright version, rather than an independently installed system Chrome.
      - name: Install locked Studio dependencies for the media export gate
        working-directory: apps/studio
        run: npm ci --ignore-scripts
      - name: Verify locked full Chromium and synthetic media tools
        working-directory: apps/studio
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install chromium --no-shell
          browser_path="$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath());")"
          test -x "$browser_path"
          "$browser_path" --version
          printf 'STUDIO_BROWSER_EXECUTABLE=%s\n' "$browser_path" >> "$GITHUB_ENV"
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Published listing navigation and opt-in video delivery
        working-directory: .
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          npm ci --ignore-scripts --prefix services/edge/tour-host
          node services/edge/tour-host/scripts/check-listing-browser.mjs
          node services/edge/tour-host/scripts/check-listing-browser.mjs --chapter-observation-delay-ms=350 --evidence="$RUNNER_TEMP/rendprop-listing-browser-delayed-chapter"
      - name: Chapter seek and Explore handoff reject missing seek, stale timing and rewind
        working-directory: .
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          for control in chapter-no-seek stale-explore-reference explore-rewind; do
            evidence_dir="$RUNNER_TEMP/rendprop-listing-browser-$control"
            set +e
            node services/edge/tour-host/scripts/check-listing-browser.mjs --fault="$control" --evidence="$evidence_dir"
            status=$?
            set -e
            test "$status" -eq 1
            LISTING_CONTROL="$control" LISTING_EVIDENCE="$evidence_dir" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const read = name => JSON.parse(readFileSync(process.env.LISTING_EVIDENCE + '/' + name));
          const receipt = read('receipt.json');
          assert.equal(receipt.fault, process.env.LISTING_CONTROL);
          assert.equal(receipt.passed, false);
          assert.deepEqual(receipt.pageErrors, []);
          if (receipt.fault === 'chapter-no-seek') {
            const chapter = read('chapter-observation.json');
            assert.equal(receipt.error, 'Room chapter seeks the actual media timeline');
            assert.ok(receipt.checks.includes('Native keyboard pause control works'));
            assert.equal(chapter.error, 'No chapter seek and decoded frame within 4000ms');
            assert.equal(chapter.seek, null);
            assert.equal(chapter.presented, null);
          } else {
            const handoff = read('explore-handoff.json');
            assert.equal(receipt.error, 'Returning to Explore pauses at the current playback position without losing the tour');
            assert.ok(receipt.checks.includes('Seeking yields a real nonempty decoded test-pattern frame'));
            assert.ok(handoff.afterExplore.paused && !handoff.afterExplore.controls && handoff.afterExplore.muted);
            assert.equal(handoff.afterExplore.currentSrc, handoff.handoff.currentSrc);
            if (receipt.fault === 'stale-explore-reference') {
              assert.ok(handoff.staleDelta > .2);
              assert.ok(Math.abs(handoff.handoffDelta) < handoff.toleranceSeconds);
            } else {
              assert.ok(Math.abs(handoff.handoffDelta) > 1);
            }
          }
          console.log('Browser negative control rejected at its intended assertion:', receipt.fault);
          JS
          done
      - name: Actual native and worker HD master encoding
        working-directory: .
        timeout-minutes: 10
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 tools/audit/run_render_quality.py
          python3 tools/audit/run_render_review_fences.py
      - name: Studio MP4 export, AAC narration and continuous agent audio
        working-directory: apps/studio
        timeout-minutes: 10
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          node tests/export-resume-browser.mjs
          node tests/export-audio-browser.mjs
          if node tests/export-audio-browser.mjs --fault=live-original-audio > "$RUNNER_TEMP/export-original-audio-defect.log" 2>&1; then
            echo "::error::Original-audio regression control unexpectedly passed"
            exit 1
          fi
          grep -q "Continuous speech through cutaway boundaries: weakest40ms RMS" "$RUNNER_TEMP/export-original-audio-defect.log"
          node tests/cloud-editor-browser.mjs
          node tests/conversation-browser.mjs
          node tests/finishing-audio-probe-controls.mjs
          node tests/finishing-browser.mjs
      - name: Retain media export receipts and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-macos-media-export-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rendprop-export-original-audio-*/receipt.json
            ${{ runner.temp }}/rendprop-export-original-audio-*/*.mp4
            ${{ runner.temp }}/export-original-audio-defect.log
            ${{ runner.temp }}/rendprop-cloud-editor-*/receipt.json
            ${{ runner.temp }}/rendprop-cloud-editor-*/*.png
            ${{ runner.temp }}/rendprop-cloud-editor-*/*.mp4
            ${{ runner.temp }}/rendprop-conversation-*/receipt.json
            ${{ runner.temp }}/rendprop-conversation-*/*.png
            ${{ runner.temp }}/rendprop-conversation-*/*.mp4
            ${{ runner.temp }}/rendprop-export-resume-*/receipt.json
            ${{ runner.temp }}/rendprop-export-resume-*/*.mp4
            ${{ runner.temp }}/rendprop-finishing-*/receipt.json
            ${{ runner.temp }}/rendprop-finishing-*/*.png
            ${{ runner.temp }}/rendprop-finishing-*/*.mp4
            ${{ runner.temp }}/rendprop-listing-browser-*/receipt.json
            ${{ runner.temp }}/rendprop-listing-browser-*/explore-handoff.json
            ${{ runner.temp }}/rendprop-listing-browser-*/chapter-seek.json
            ${{ runner.temp }}/rendprop-listing-browser-*/chapter-observation.json
            ${{ runner.temp }}/rendprop-listing-browser-*/playback-clock.json
            ${{ runner.temp }}/rendprop-listing-browser-*/decoded-frame.json
            ${{ runner.temp }}/rendprop-listing-browser-*/*.png
            ${{ runner.temp }}/rendprop-listing-browser-*/*.mp4
            ${{ runner.temp }}/rendprop-render-concurrency-hd-*/receipt.json
            ${{ runner.temp }}/rendprop-render-concurrency-hd-*/*.log
            ${{ runner.temp }}/rendprop-render-concurrency-hd-*/**/*.json
            ${{ runner.temp }}/rendprop-render-review-fences-*/receipt.json
            ${{ runner.temp }}/rendprop-render-review-fences-*/*.log
          retention-days: 7
          if-no-files-found: warn

  upload-gateway:
    name: Cloudflare Worker (upload-gateway, deno check + tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Same exact pin as edge-functions.
          deno-version: "2.9.6"
      # The adapter and its tests import local sources plus the pinned std
      # assert module only. No network at runtime, no subprocess, no writes.
      - name: Run the gateway tests
        run: deno test --no-config --no-lock --deny-net --deny-run --deny-write --allow-read --allow-env services/edge/upload-gateway/
      # worker-configuration.d.ts is wrangler's generated Cloudflare runtime
      # typing and collides with Deno's own DOM lib, so the gateway's tsconfig
      # (lib: ES2022) has to be the config in force for the check to mean
      # anything; a wrong Env binding fails it, a Deno/Worker lib clash must not.
      - name: Typecheck the Worker entrypoint
        working-directory: services/edge/upload-gateway
        run: deno check --config tsconfig.json --no-lock --node-modules-dir=auto index.ts

  edge-functions:
    name: Supabase edge functions (deno check + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Exact pin (was the floating v2.x) — 2.9.6 is the latest 2.x release
          # and is what every edge-function test below was verified against.
          deno-version: "2.9.6"

      # Every function must typecheck. `me` once failed here on a WebCrypto
      # signature — exactly the class of bug this catches before deploy.
      - name: Typecheck every function
        working-directory: services/supabase/functions
        run: |
          echo '{"nodeModulesDir":"auto"}' > deno.json
          fail=0
          for d in */; do
            f="${d}index.ts"
            [ -f "$f" ] || continue
            [ "${d%/}" = "_shared" ] && continue
            if deno check "$f" >/tmp/out 2>&1; then
              echo "OK   ${d%/}"
            else
              echo "FAIL ${d%/}"; sed -n '1,25p' /tmp/out; fail=1
            fi
          done
          exit $fail

      # Hermetic edge-function tests. The SUMMARY line records the actual
      # inventory (1,521 passed in the October 5 local audit); do not treat
      # fixture-only checks as production/provider or camera acceptance.
      # A real local-SQL presenter controller case runs in its dedicated
      # disposable Postgres job instead of this unit-suite environment.
      # --node-modules-dir=auto (a flag, not a committed deno.json) lays out
      # node_modules for the `npm:` specifiers.
      - name: Run edge function tests
        working-directory: services/supabase/functions
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          deno test --allow-all --node-modules-dir=auto . 2>&1 | tee /tmp/edge-function-tests.log
          summary=$(grep -E '^(ok|FAILED) \| [0-9]+ passed \| [0-9]+ failed' /tmp/edge-function-tests.log | tail -n 1)
          echo "SUMMARY: ${summary:-no Deno summary line found}"
          test -n "$summary"

      # The upload fixtures live in tools/audit (they double as offline audit
      # evidence) and reach this suite through three-line registration files
      # in uploads/. Run them directly too, by glob, so a fixture without a
      # registration file — renewal today, whatever comes next — still runs.
      - name: Run the tools/audit upload fixtures directly
        working-directory: services/supabase/functions
        run: deno test --allow-all --node-modules-dir=auto ../../../tools/audit/uploads_*_test.ts
      - name: Actual listing intent handler against closed transport
        run: deno run --cached-only --allow-env --allow-read tools/audit/listing-facts-handler-20261004.ts

  db-migrations:
    name: Supabase migrations (fresh replay + invariants)
    runs-on: ubuntu-latest
    # A plain Postgres 16 stands in for the Supabase database: tests/ci-bootstrap.sql
    # recreates the slice the migrations depend on (API roles, auth schema,
    # auth.uid(), Supabase's default privileges). No credentials, no Docker-in-Docker.
    services:
      postgres:
        # Digest-pinned (audit supply-chain finding — a bare `postgres:16` tag
        # is mutable). Resolved 2026-09-07 from the live registry, and it is
        # the multi-arch index (covers linux/amd64, what ubuntu-latest runs):
        #   TOKEN=$(curl -sS 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/postgres:pull' | python3 -c "import json,sys;print(json.load(sys.stdin)['token'])")
        #   curl -sS -D - -o /dev/null -H "Authorization: Bearer $TOKEN" \
        #     -H 'Accept: application/vnd.oci.image.index.v1+json' \
        #     https://registry-1.docker.io/v2/library/postgres/manifests/16
        #   # -> docker-content-digest: sha256:...
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rendprop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: rendprop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: psql client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Bootstrap the Supabase baseline (roles, auth schema, default privileges)
        run: psql -v ON_ERROR_STOP=1 -q -f services/supabase/tests/ci-bootstrap.sql

      # Every migration, in the order production received them (LC_ALL=C so the
      # 0005b / 0008b interleaves sort where they belong), each in ONE transaction
      # so a failing file leaves no half-applied state behind.
      - name: Apply every migration on a fresh database
        run: |
          for f in $(ls services/supabase/migrations/*.sql | LC_ALL=C sort); do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -q -1 -f "$f"
          done

      # Test current writers here. Historical replay runs in the clean second
      # database below; old function bodies cannot be replayed over their newer
      # receipt-identity replacements on the final schema.
      - name: Durable video reflection jobs on the final schema
        run: |
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/video_erase.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/video_erase_direct_bria.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/legacy_photo_fallback.sql

      - name: Concurrent reflection receipts, cancellation and cost fences
        run: |
          createdb --template=rendprop erase_audit
          trap 'dropdb --if-exists erase_audit' EXIT
          python3 tools/audit/call-20260919/web/erase-concurrency.py psql -X --no-password -v ON_ERROR_STOP=1 -d erase_audit

      - name: Inclusive serving funds, Apple trial pool and finite reviewer authority
        run: |
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/funded_serving.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/bounded_subscription_trial.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/subscription_trial_purchase_reservations.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/subscription_trial_video_duration.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/modern_service_transport.sql
          # Launch ceiling mode (2026-10-08): money admission, SKU envelopes,
          # fail-closed configuration, Sandbox trials, free slots, retention.
          # Keep these on the final schema. Historical versions are replayed
          # only in the second clean database below.
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/launch_blockers.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/serving_grace.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/serving_settlement_identity.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/ops_deleted_workspace.sql

      # The adversarial battery: privileged surface, grants, plan coherence
      # (enforced == published), lifecycle schema, and a mutating fixture that
      # exercises signup → publish → quota → chapters → leads → delete.
      - name: Invariants (all270 must pass)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/invariants.sql 2>&1 | tee /tmp/invariants.out
          grep -q 'All 270 invariants passed.' /tmp/invariants.out

      # Replay each historical version before a later migration replaces it.
      #0050's old overload is intentionally superseded by0051; applying0050
      #backwards onto the final schema is not a supported production sequence.
      - name: Replay migrations twice at their historical schema points
        env:
          PGDATABASE: rendprop_replay
        run: |
          createdb rendprop_replay
          psql -v ON_ERROR_STOP=1 -q -f services/supabase/tests/ci-bootstrap.sql
          # Use the same exact replay policy as the disposable runner. The
          # listed transactional Studio migrations still run once in EACH
          # fresh database; their CREATE statements are not replay APIs.
          python3 - <<'PY' > /tmp/rendprop-replayable-migrations.txt
          from pathlib import Path
          from tools.audit.run_database_regression import replayable_migration
          for path in sorted(Path('services/supabase/migrations').glob('*.sql')):
              if replayable_migration(path.name):
                  print(path)
          PY
          for f in $(ls services/supabase/migrations/*.sql | LC_ALL=C sort); do
            psql -v ON_ERROR_STOP=1 -q -1 -f "$f"
            if grep -Fxq "$f" /tmp/rendprop-replayable-migrations.txt; then
              psql -v ON_ERROR_STOP=1 -q -1 -f "$f"
            fi
          done
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/video_erase.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/video_erase_direct_bria.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/legacy_photo_fallback.sql
          # Run the same serving fixtures after the supported historical replay
          # reaches the final schema, including strict settlement and grace.
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/funded_serving.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/bounded_subscription_trial.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/subscription_trial_purchase_reservations.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/subscription_trial_video_duration.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/modern_service_transport.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/launch_blockers.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/serving_grace.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/serving_settlement_identity.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/ops_deleted_workspace.sql

      - name: Invariants after the replay (all270 must pass)
        env:
          PGDATABASE: rendprop_replay
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/invariants.sql 2>&1 | tee /tmp/invariants.out
          grep -q 'All 270 invariants passed.' /tmp/invariants.out

  db-publication-regression:
    name: Disposable PostgreSQL publication, invariant and deletion regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    # Do not reuse db-migrations' TCP service/database. Every runner below
    # owns its own initdb, a private Unix socket and database, verifies
    # identity, discards inherited PG credentials, and stops only its own
    # cluster. Every invariant must pass on fresh and replayed schemas; the
    # historical agent-reel headroom exception has been removed.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # run_deletion_handler_regression.py proves its test catches the
          # pre-0039 handler by checking that handler out of git history; a
          # depth-1 checkout does not have that commit.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Same exact pin as edge-functions; the handler and spatial edge
          # regressions run the real Deno test files offline.
          deno-version: "2.9.6"
      - name: Install explicit PostgreSQL 16 binaries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-client-16
          for tool in initdb pg_ctl psql createdb; do
            test -x "/usr/lib/postgresql/16/bin/$tool"
            pg_version=$("/usr/lib/postgresql/16/bin/$tool" --version)
            [[ "$pg_version" == "$tool (PostgreSQL) 16."* ]]
            printf '%s\n' "$pg_version"
          done
      # Some of the audit runners were written on a Mac and still open
      # /opt/homebrew/opt/postgresql@17/bin by absolute path. Give that path
      # the same PostgreSQL 16 tools as a symlink farm so they run unmodified
      # here; the runners that discover tools from PATH never touch it.
      - name: Provide the Homebrew postgresql@17 path the older runners hardcode
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/homebrew/opt/postgresql@17
          sudo ln -s /usr/lib/postgresql/16/bin /opt/homebrew/opt/postgresql@17/bin
          for tool in initdb pg_ctl psql createdb; do
            test -x "/opt/homebrew/opt/postgresql@17/bin/$tool"
          done
      - name: Run actual SQL fixtures, replay and deliberately broken guards
        id: database
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          python3 tools/audit/run_database_regression.py
      - name: Direct Bria reservations, stage admissions and cancellation races
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          python3 services/supabase/tests/video_erase_direct_bria_pg.py
      - name: Ordinary video priced admission, settlement and deletion races
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          python3 services/supabase/tests/app_video_cost_pg.py
      # The spatial edge regression runs --cached-only without preparing its
      # own cache (the deletion runners do), so fill the Deno cache with every
      # first-party edge module's pinned std/npm imports first. This is the
      # only step here that may reach the network for Deno.
      - name: Warm the Deno cache for the offline edge regressions
        shell: bash
        run: |
          set -euo pipefail
          deno install --no-config --no-lock --node-modules-dir=none --entrypoint \
            $(find services/supabase/functions -name '*.ts' -not -path '*/node_modules/*' | sort)
      # Deletion intent/spatial overlap, adoption recovery, spatial jobs,
      # provider journal, the real /me handler, the spatial edge handler and
      # the upload transport SQL — each against its own disposable cluster or
      # fixture doubles, never a shared or hosted database.
      - name: Deletion, adoption, spatial, handler and upload transport regressions
        id: fixtures
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          python3 tools/audit/test_privacy_receipt_fail_closed.py
          python3 tools/audit/run_deletion_integrity.py
          python3 tools/audit/run_deletion_regression.py --provider-commit "$GITHUB_SHA"
          python3 tools/audit/run_adoption_regression.py
          python3 tools/audit/run_team_readiness.py
          python3 tools/audit/run_subscription_trial_regression.py
          python3 tools/audit/run_subscription_chronology.py
          python3 tools/audit/test_workspace_handler_inventory.py --out "$RUNNER_TEMP/rendprop-workspace-inventory"
          python3 tools/audit/run_workspace_selection.py
          python3 tools/audit/run_team_private_libraries.py
          python3 tools/audit/run_internal_testing_grants.py
          python3 tools/audit/run_private_internal_testing.py
          python3 services/supabase/tests/funded_serving_pg.py
          python3 services/supabase/tests/verified_retail_guest_pg.py
          python3 services/supabase/tests/subscription_trial_video_duration_pg.py
          python3 services/supabase/tests/subscription_trial_purchase_reservations_pg.py
          python3 services/supabase/tests/bounded_subscription_trial_pg.py
          python3 services/supabase/tests/serving_photo_partitions_pg.py
          python3 services/supabase/tests/launch_blockers_pg.py
          python3 tools/audit/run_listing_gallery_selection.py
          python3 tools/audit/run_listing_measurement_cas.py
          python3 tools/audit/run_listing_facts_cas.py
          python3 tools/audit/run_brand_logo_regression.py
          python3 tools/audit/run_personal_card_regression.py
          python3 tools/audit/run_member_portfolio_regression.py
          python3 tools/audit/run_account_export.py
          python3 tools/audit/run_photographer_client_delivery.py
          python3 tools/audit/run_spatial_regression.py
          python3 tools/audit/run_spatial_provider_regression.py
          python3 tools/audit/run_deletion_handler_regression.py
          python3 tools/audit/run_spatial_edge_regression.py
          python3 tools/audit/test_upload_transport_db.py
          python3 services/supabase/tests/production_review.py
          python3 services/supabase/tests/presenter_workspace.py
          python3 services/supabase/tests/presenter_execution.py --controller
          python3 services/supabase/tests/prompt_library.py
          python3 tools/audit/run_studio_private_media.py
          python3 tools/audit/run_photo_authority.py
          python3 tools/audit/run_backend_billing_authority.py
          python3 tools/audit/run_verified_recipients.py
          python3 tools/audit/run_privacy_cleanup_inventory.py
          python3 tools/audit/run_upload_privacy_admission.py
          python3 tools/audit/run_bounded_media_delivery.py
      # A real red invariant suite still runs positive/negative publication
      # fixtures before exiting nonzero. Preserve its evidence, not a green
      # override. Preflight can fail before the runner creates any evidence.
      # Every runner above writes /tmp/rendprop-<fixture>-*/receipt.json.
      - name: Retain database receipts and logs, including failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: disposable-database-regression-${{ github.run_attempt }}
          path: |
            /tmp/rendprop-*/receipt.json
            /tmp/rendprop-*/*.log
            /tmp/rendprop-gallery-selection-*/*.json
            /tmp/rendprop-privacy-receipt-*/**/receipt.json
            /tmp/rendprop-privacy-receipt-*/**/*.log
            /tmp/rendprop-photographer-client-*/*.json
            ${{ runner.temp }}/rendprop-workspace-inventory/receipt.json
            build/pr-*/receipt.json
            build/pr-*/server.log
            build/pres-*/receipt.json
            build/pres-*/server.log
            build/pres-*/controller.log
            build/pex-*/receipt.json
            build/pex-*/controller.log
            build/pex-*/server.log
            build/prm-*/receipt.json
            build/prm-*/server.log
          retention-days: 7
          if-no-files-found: ${{ steps.database.outcome == 'success' && 'error' || 'warn' }}

  python-worker:
    name: Python workers (render, spatial, training adapter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Byte-compile worker, pipeline, spatial worker and training adapter
        run: |
          python -m compileall -q services/worker services/pipeline services/spatial-worker tools/spatial-spike/training

      # requirements.txt is pinned (audit round 4); a stray `>=` reintroduces
      # non-reproducible images.
      - name: Requirements must be exactly pinned
        run: |
          if grep -nE '^[a-zA-Z0-9_.-]+\s*>=' services/worker/requirements.txt; then
            echo "::error::services/worker/requirements.txt has an unpinned (>=) dependency"
            exit 1
          fi
          echo "all worker requirements are pinned"

      # ffmpeg is what tests/test_hdr_tonemap.py actually exercises (needs
      # libzimg's zscale+tonemap) — installed explicitly rather than trusting
      # whatever the runner image happens to preinstall; Ubuntu's package
      # includes libzimg.
      - name: Install pinned worker Python dependencies
        timeout-minutes: 10
        run: pip install --disable-pip-version-check -r services/worker/requirements.txt
      - name: Install worker ffmpeg
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      # Both hermetic: no live Supabase, no real R2, no network beyond
      # localhost. test_job_lease.py runs a stdlib-only fake PostgREST on
      # 127.0.0.1 (tests/fake_postgrest.py) to exercise claim/lease/heartbeat/
      # reap. test_hdr_tonemap.py synthesises its own fixtures with local
      # ffmpeg and measures the real encode path; if the runner's ffmpeg build
      # lacks zscale/tonemap it FAILS. Missing prerequisites are not evidence
      # that an encode passed; the prerequisite regressions enforce this.
      #
      # Run as plain scripts, NOT via pytest: their `check()` helper only
      # appends to a list and never raises, so pytest would happily report a
      # false "N passed" even if every internal check failed — only an
      # unhandled exception fails a pytest run. Trust each file's own exit
      # code instead (0 = all checks passed, 1 = at least one failed).
      #
      # services/pipeline has no tests/ directory yet (stdlib-only glue code,
      # exercised today through its own cli.py cost-test path) — nothing to
      # wire up there until one exists.
      - name: Run worker tests (ownership, recovery, resources and HDR)
        run: |
          python3 services/worker/tests/test_job_lease.py
          python3 services/worker/tests/reproduce_stale_publish.py
          python3 services/worker/tests/test_reaper_snapshot.py
          python3 services/worker/tests/test_verification_prerequisites.py
          python3 services/worker/tests/test_stream_fallback.py
          python3 services/worker/tests/test_provider_funding.py
          python3 services/worker/tests/test_lease_probe_fail_closed.py
          python3 services/worker/tests/test_process_specific.py
          python3 services/worker/tests/test_cost_spool.py
          python3 services/worker/tests/test_r2_timeouts.py
          python3 services/worker/tests/test_storage_admission.py
          python3 services/worker/tests/test_credential_redirect_boundary.py
          python3 services/worker/tests/test_resource_limits.py
          python3 services/worker/tests/test_hdr_tonemap.py

      # The spatial worker (Modal controller + provider journal) and the Phase A
      # training adapter (capture handoff, COLMAP export, retry/room modules)
      # keep their tests next to the code as test_*.py and use unittest, so
      # discovery picks up new files with no edit here. Pinned exactly, the
      # versions the adapter README records as verified: modal for the
      # controller import (importing app.py starts nothing and allocates no
      # GPU), Pillow for the JPEG decode, numpy + tyro for the trainer CLI
      # parsing. Nothing here contacts Modal, a GPU or any provider.
      - name: Install spatial worker + training adapter deps (pinned)
        run: pip install --disable-pip-version-check modal==1.5.3 Pillow==12.3.0 numpy==1.26.4 tyro==0.9.35

      - name: Run spatial worker tests (unittest discovery)
        run: python3 -m unittest discover -s services/spatial-worker -p 'test_*.py'

      - name: Run training adapter tests (unittest discovery)
        run: python3 -m unittest discover -s tools/spatial-spike/training -p 'test_*.py'

  ios-static:
    name: iOS static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # App Review Guideline 3.1: with StoreKit disabled, no digital-goods price
      # may exist in the app — including data the UI never renders (P0-5 shipped
      # a compiled $29–$279 table after the visible prices were removed).
      - name: No compiled digital-goods pricing
        run: |
          if grep -rnE '\.dollars\([0-9]{1,3}\)' apps/ios/Rendprop --include='*.swift'; then
            echo "::error::small-dollar literal in app source — digital-goods pricing must not ship while StoreKit is off"
            exit 1
          fi
          if grep -rniE 'first (ai )?(tour )?(render|video tour) (is )?free' apps/ios/Rendprop --include='*.swift'; then
            echo "::error::purchase-implying 'first ... free' copy found"
            exit 1
          fi
          echo "no digital pricing or purchase implications in app source"

      - name: Privacy manifest parses and declares what we collect
        run: |
          python3 - <<'PY'
          import plistlib, sys
          d = plistlib.load(open('apps/ios/Rendprop/PrivacyInfo.xcprivacy','rb'))
          entries = d.get('NSPrivacyCollectedDataTypes', [])
          types = {t['NSPrivacyCollectedDataType'] for t in entries}
          required = {
              'NSPrivacyCollectedDataTypePhoneNumber',
              'NSPrivacyCollectedDataTypePhysicalAddress',
              # The account identifier every listing, tour and lead is linked to
              # (Supabase auth user id / JWT). Apple's "User ID" type — the App
              # Store Connect labels are derived from this manifest, so omitting
              # it makes the labels disagree with the app (audit F-C-20).
              'NSPrivacyCollectedDataTypeUserID',
              # Listing coordinates are rounded to 3 decimals. Apple defines
              # Precise Location as "the same or greater resolution as a latitude
              # and longitude with three or more decimal places", so 3 decimals
              # IS precise and must be declared as such — declaring Coarse here
              # would under-report. Matching ASC answer: Location -> Precise.
              'NSPrivacyCollectedDataTypePreciseLocation',
          }
          missing = required - types
          if missing:
              print('::error::privacy manifest missing:', ', '.join(sorted(missing))); sys.exit(1)
          if 'NSPrivacyCollectedDataTypeCoarseLocation' in types:
              print('::error::manifest declares CoarseLocation; 3-decimal coordinates are Precise by Apple\'s definition'); sys.exit(1)
          # Nothing may be declared as used for tracking: NSPrivacyTracking is
          # false and there are no tracking domains, so a `true` here would be
          # an internal contradiction App Review rejects on.
          if d.get('NSPrivacyTracking') is not False:
              print('::error::NSPrivacyTracking must be false'); sys.exit(1)
          tracked = [t['NSPrivacyCollectedDataType'] for t in entries
                     if t.get('NSPrivacyCollectedDataTypeTracking')]
          if tracked:
              print('::error::declared as tracking while NSPrivacyTracking is false:', ', '.join(tracked)); sys.exit(1)
          # Every declared type needs at least one purpose, or the manifest is
          # incomplete and ASC cannot derive a label from it.
          for t in entries:
              if not t.get('NSPrivacyCollectedDataTypePurposes'):
                  print('::error::no purpose declared for', t['NSPrivacyCollectedDataType']); sys.exit(1)
          if not d.get('NSPrivacyAccessedAPITypes'):
              print('::error::NSPrivacyAccessedAPITypes is missing'); sys.exit(1)
          print('privacy manifest OK:', len(types), 'collected types')
          PY

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
