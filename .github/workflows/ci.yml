            /tmp/rendprop-production-*/*.png
            /tmp/rendprop-listing-finish-*/receipt.json
            /tmp/rendprop-listing-finish-*/*.png
            /tmp/rendprop-listing-kit-*/receipt.json
            /tmp/rendprop-listing-kit-*/*.png
            /tmp/rendprop-connected-browser-*/receipt.json
            /tmp/rendprop-connected-browser-*/*.png
            /tmp/rendprop-studio-recovery-*/receipt.json
            ${{ runner.temp }}/recovery-*.log
            /tmp/rendprop-contact-navigation-*/receipt.json
            /tmp/rendprop-contact-navigation-*/*.png
            /tmp/rendprop-listing-facts-browser-*/receipt.json
            /tmp/rendprop-listing-facts-browser-*/*.png
            /tmp/rendprop-creation-shell-*/receipt.json
