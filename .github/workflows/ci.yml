name: CI

# Every gate that caught a real bug during the 2026-08 audit rounds, wired so it
# runs on every push instead of only when someone remembers. Nothing here needs
# production credentials — it is all static/offline verification.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Jobs may read source/artifacts; no default repository write token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-harnesses:
    name: Offline audit evidence, consent and adoption source gates
    # macOS on purpose: three of the tests/phase1/*.test.mjs gates compile
    # production Swift (Foundation + Combine) with /usr/bin/swiftc and assert on
    # the binary, and the glob below is meant to pick up every new gate without
    # anyone editing this file. There is no Linux toolchain for those sources.
    # Use the original Apple Silicon runner. The temporary Intel fallback
    # stalled in CoreSimulator before the UIKit export checks could execute.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The floor-plan boundary compares preserved scan/import bodies
          # against build75. A depth-one checkout omits that exact baseline.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Ensure ripgrep for native source and privacy controls
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          rg --version
      - name: Database runner control-flow (mocked, no database)
        run: python3 tools/audit/test_database_runner.py
      - name: Exact rollout readback, freshness and artifact refusals (offline)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tools/deploy/test_verify_rollout_readback.py
          python3 tools/deploy/test_verify_release_binding.py
      - name: Invariant source registration contracts
        run: python3 tools/audit/test_database_invariant_sources.py
      - name: Republish retry clears a stale warning before its sync refusals (source gate)
        run: python3 tools/audit/test_republish_retry_source.py
      - name: Native account and workspace presentation privacy
        run: python3 tools/audit/run_native_presentation_privacy.py --out "$RUNNER_TEMP/native-presentation-privacy"
      - name: Native deletion confirmation and late-response account privacy
        run: python3 tools/audit/run_native_account_deletion.py --out "$RUNNER_TEMP/native-account-deletion"
      - name: Retain native deletion admission and guard-removal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-account-deletion-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-presentation-privacy/receipt.json
            ${{ runner.temp }}/native-presentation-privacy/*.log
            ${{ runner.temp }}/native-presentation-privacy/*.swift
            ${{ runner.temp }}/native-account-deletion/receipt.json
            ${{ runner.temp }}/native-account-deletion/*.log
            ${{ runner.temp }}/native-account-deletion/*.swift
      # Every Phase 1 node gate, discovered by glob: consent selector and Ask AI
      # label source contracts, adoption source/mutant/local-binding gates and
      # the consent persistence gate. None of them is a UI runtime test.
      - name: Phase 1 source and executable-Swift gates (tests/phase1/*.test.mjs)
        run: node --test tests/phase1/*.test.mjs
      - name: Ask AI offline replies and selected-screen privacy controls
        run: |
          set -o pipefail
          bash tests/phase1/run-unit.sh 2>&1 | tee "$RUNNER_TEMP/rendprop-coach-native.log"
      - name: Draft corrections survive an older cloud snapshot
        run: python3 tools/audit/complete-product-20260922/photos_sync.py --output-directory "$RUNNER_TEMP/rendprop-photos-sync/baseline"
      - name: Draft sync rejects compiled dirty-write and identity regressions
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rendprop-photos-sync'
          cases = [('dirty-write', ['--inject-fault'], 'expectedDirtyAssertionRejected'),
                   ('photos-context', ['--inject-context-fault', 'photos'], 'expectedContextAssertionRejected'),
                   ('receive-context', ['--inject-context-fault', 'receive'], 'expectedContextAssertionRejected')]
          for name, flags, field in cases:
              out = root / name
              result = subprocess.run([sys.executable, 'tools/audit/complete-product-20260922/photos_sync.py', *flags, '--output-directory', str(out)], check=False)
              receipt = json.loads((out / 'receipt.json').read_text())
              if result.returncode != 1 or receipt.get('passed') is not False or receipt.get('compiled') is not True or receipt.get('sourceBoundAtEnd') is not True or receipt.get(field) is not True:
                  raise SystemExit(f'{name}: expected a named runtime rejection after a successful source-bound compile')
          PY
      - name: Retain draft synchronization receipts and control logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: draft-synchronization-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rendprop-photos-sync/**/receipt.json
            ${{ runner.temp }}/rendprop-photos-sync/**/*.log
      - name: Phone production plan preservation and sync receipts
        run: |
          production_test_dir=$(mktemp -d)
          swiftc -parse-as-library \
            apps/ios/Rendprop/Models/ProductionGuidance.swift \
            apps/ios/Rendprop/Networking/ProductionPlan.swift \
            apps/ios/tests/ProductionPlanTests.swift \
            -o "$production_test_dir/production-plan-tests"
          "$production_test_dir/production-plan-tests"
      - name: Phone production autosync survives lost replies and relaunch
        run: bash apps/ios/tests/run-production-writer.sh
      - name: Phone production work survives anonymous-account adoption
        run: bash apps/ios/tests/run-adoption-production.sh
      - name: Home location callbacks and restore snapshots retain their opening identity
        run: python3 apps/ios/tests/run-home-restore-async-boundaries.py --out "$RUNNER_TEMP/rendprop-home-restore-async"
      - name: Guest personal cards and paid requests survive only verified adoption
        run: python3 apps/ios/tests/run-adoption-owned-identity.py
      - name: Subscription offer disclosures and durable workspace intent
        run: bash apps/ios/tests/run-subscription-policy.sh
      - name: Coming-soon Aerial admission preserves existing accepted jobs and saved clips
        run: python3 apps/ios/tests/run-aerial-launch-availability.py --evidence-dir "$RUNNER_TEMP/rendprop-aerial-launch"
      - name: Introduction replay presents the movie without resetting account or ongoing work
        run: python3 apps/ios/tests/run-settings-intro-replay.py --evidence-dir "$RUNNER_TEMP/rendprop-settings-intro-replay"
      - name: Private testing allowance labels preserve ordinary plan displays
        run: python3 apps/ios/tests/run-workspace-allowance-display.py --out "$RUNNER_TEMP/rendprop-testing-allowance"
      - name: Verified trial counters and disabled offers preserve billing dates
        run: python3 apps/ios/tests/run-native-trial.py --out "$RUNNER_TEMP/rendprop-native-trial"
      - name: Configured photo admissions and separate AI balance remain workspace bound
        run: python3 apps/ios/tests/run-serving-photo-package.py --out "$RUNNER_TEMP/rendprop-native-photo-package"
      - name: Retain photo package decoding and compiled refusal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-photo-package-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rendprop-native-photo-package/receipt.json
            ${{ runner.temp }}/rendprop-native-photo-package/*.log
            ${{ runner.temp }}/rendprop-native-photo-package/*.swift
      - name: Atomic pre-StoreKit trial buyer reservation and compiled controls
        run: python3 apps/ios/tests/run-native-trial-hold.py --out "$RUNNER_TEMP/rendprop-native-trial-hold"
      - name: Durable StoreKit intervention and purchase recovery controls
        run: python3 apps/ios/tests/run-purchase-fulfilment.py --out "$RUNNER_TEMP/rendprop-purchase-fulfilment"
      - name: Property website consumable custody and account recovery controls
        run: python3 apps/ios/tests/run-website-upgrade.py --out "$RUNNER_TEMP/rendprop-website-upgrade"
      - name: Retain purchase recovery runtime and guard-removal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: purchase-fulfilment-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rendprop-purchase-fulfilment/receipt.json
            ${{ runner.temp }}/rendprop-purchase-fulfilment/*.log
            ${{ runner.temp }}/rendprop-purchase-fulfilment/*.swift
            ${{ runner.temp }}/rendprop-website-upgrade/receipt.json
            ${{ runner.temp }}/rendprop-website-upgrade/**/*.log
            ${{ runner.temp }}/rendprop-website-upgrade/**/*.swift
      - name: Private media gateway actor binding and import context controls
        run: python3 apps/ios/tests/run-private-media-gateway.py --out "$RUNNER_TEMP/rendprop-private-media-gateway"
      - name: Retain private media gateway runtime and guard-removal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-media-gateway-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rendprop-private-media-gateway/receipt.json
            ${{ runner.temp }}/rendprop-private-media-gateway/*.log
            ${{ runner.temp }}/rendprop-private-media-gateway/*.swift
      - name: Native UX preserves drafts, deferred links, consent and archive baselines
        run: python3 apps/ios/tests/run-native-ux-audit.py --evidence-dir "$RUNNER_TEMP/rendprop-native-ux-audit"
      - name: Native client verification and lead deletion require scoped receipts
        run: python3 apps/ios/tests/run-native-lead-privacy.py --evidence-dir "$RUNNER_TEMP/rendprop-native-lead-privacy"
      - name: Leads tab groups exact listing identities and preserves existing destinations
        run: python3 apps/ios/tests/run-lead-inbox-grouping.py --evidence-dir "$RUNNER_TEMP/rendprop-lead-inbox"
      - name: Public buyer links stay in the browser and preserve publication identity
        run: python3 apps/ios/tests/run-public-website-links.py --evidence-dir "$RUNNER_TEMP/rendprop-public-links"
      - name: Private library identity, delegation, purchase scope and refusal controls
        run: python3 apps/ios/tests/run-private-library-context.py --out "$RUNNER_TEMP/rendprop-private-library-context"
      - name: Push account switch cleanup, stale acknowledgments and recipient fences
        run: python3 apps/ios/tests/run-push-account-isolation.py --out "$RUNNER_TEMP/rendprop-push-account-isolation"
      - name: Account downloads verify manifests, account changes and private generation-owned files
        run: python3 apps/ios/tests/run-account-export.py --evidence-dir "$RUNNER_TEMP/rendprop-native-account-export"
      - name: Photo lens, orientation, level and failed-save handling
        run: bash apps/ios/tests/run-photo-capture.sh
      - name: Photo versions, retained originals and destination export geometry
        run: bash apps/ios/tests/run-photo-delivery.sh
      - name: Large photo imports preserve selection order, source bytes and partial failures
        run: python3 apps/ios/tests/run-photo-import.py --evidence-dir "$RUNNER_TEMP/rendprop-photo-import"
      - name: Browser originals retain full resolution, orientation and color with exact local sources
        run: python3 apps/ios/tests/run-photo-browser-original.py --evidence-dir "$RUNNER_TEMP/rendprop-photo-browser-original"
      - name: Photo review previews and pre-sign-in playback preserve local privacy
        run: python3 apps/ios/tests/run-photo-review-preview.py --evidence-dir "$RUNNER_TEMP/rendprop-photo-review-preview"
      - name: Individual photo review edits one retained original without changing bulk editing
        run: python3 apps/ios/tests/run-photo-review-edit.py --evidence-dir "$RUNNER_TEMP/rendprop-photo-review-edit"
      - name: Photo family browsing preserves upload order and exact version/edit identity
        run: python3 apps/ios/tests/run-photo-family-pager.py --evidence-dir "$RUNNER_TEMP/rendprop-photo-family-pager"
      - name: Exact cloud photo family choices and durable typed transport
        run: python3 apps/ios/tests/run-photo-cloud-selection.py --output-dir "$RUNNER_TEMP/rendprop-photo-cloud-selection"
      - name: Initial photo publication queue preserves current cloud choices and cover
        run: python3 apps/ios/tests/run-photo-cloud-initial-publication.py --output-dir "$RUNNER_TEMP/rendprop-photo-cloud-initial"
      - name: Automatic photo callbacks cannot upload or overwrite cloud selection
        run: python3 apps/ios/tests/run-photo-cloud-automatic-sync.py --output-dir "$RUNNER_TEMP/rendprop-photo-cloud-automatic"
      - name: Local photo selection retains version review and removal controls
        run: python3 apps/ios/tests/run-photo-listing-selection.py --evidence-dir "$RUNNER_TEMP/rendprop-photo-local-selection"
      - name: Optional photo feedback queues exact outputs offline and leaves review, save and publish unchanged
        run: python3 apps/ios/tests/run-photo-feedback.py --evidence-dir "$RUNNER_TEMP/rendprop-photo-feedback"
      - name: Retain exact cloud selection and local selection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-photo-selection-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rendprop-photo-cloud-selection/receipt.json
            ${{ runner.temp }}/rendprop-photo-cloud-selection/*.log
            ${{ runner.temp }}/rendprop-photo-cloud-selection/*.swift
            ${{ runner.temp }}/rendprop-photo-cloud-initial/receipt.json
            ${{ runner.temp }}/rendprop-photo-cloud-initial/*.log
            ${{ runner.temp }}/rendprop-photo-cloud-initial/*.swift
            ${{ runner.temp }}/rendprop-photo-cloud-automatic/receipt.json
            ${{ runner.temp }}/rendprop-photo-cloud-automatic/*/*.log
            ${{ runner.temp }}/rendprop-photo-cloud-automatic/*/*.swift
            ${{ runner.temp }}/rendprop-photo-local-selection/receipt.json
            ${{ runner.temp }}/rendprop-photo-local-selection/*/*.log
            ${{ runner.temp }}/rendprop-photo-local-selection/*/*.swift
            ${{ runner.temp }}/rendprop-photo-feedback/**
      - name: Branded quick-start video stays within two minutes with a readable transcript
        run: |
          if ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
          python3 apps/ios/tests/run-quick-start-video.py --evidence-dir "$RUNNER_TEMP/rendprop-quick-start-video"
      - name: Photo review and saved reel settings stay bound to the selected versions
        run: python3 apps/ios/tests/run-photo-reel-egress.py --evidence-dir "$RUNNER_TEMP/rendprop-photo-reel-egress"
      - name: Room names and listing coordinates commit the current form values
        run: python3 apps/ios/tests/run-native-form-commits.py --evidence-dir "$RUNNER_TEMP/rendprop-native-form-commits"
      - name: Actual gallery sync races, warning recovery and provenance fences
        run: |
          python3 tools/audit/gallery-sync-20261002/run.py
          for fault in clear-unrelated stale-selection ignore-provenance; do
            python3 tools/audit/gallery-sync-20261002/run.py --inject-fault "$fault"
          done
      - name: Reel generation stops at failures and retains completed clips
        run: python3 apps/ios/tests/run-reel-batch-stop.py --evidence-dir "$RUNNER_TEMP/rendprop-reel-batch-stop"
      - name: Retain reel batch ordering and classified guard-removal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reel-batch-stop-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rendprop-reel-batch-stop/receipt.json
            ${{ runner.temp }}/rendprop-reel-batch-stop/*.log
      - name: Actual QC wire preserves first attempt, bounded retry and provenance
        run: python3 apps/ios/tests/run-video-drift-wire.py --evidence-dir "$RUNNER_TEMP/rendprop-video-drift-wire"
      - name: Full-photo reel framing preserves wire intent and legacy receipts
        run: python3 apps/ios/tests/run-reel-framing-wire.py --evidence-dir "$RUNNER_TEMP/rendprop-reel-framing-wire"
      - name: Video destination and larger photo sequences survive saved work and recovery
        run: python3 apps/ios/tests/run-video-purpose.py --evidence-dir "$RUNNER_TEMP/rendprop-video-purpose"
      - name: Pending narration cannot freeze stale audio or discard an active recording
        run: python3 apps/ios/tests/run-video-narration-readiness.py --evidence-dir "$RUNNER_TEMP/rendprop-video-narration-readiness"
      - name: Selected photo versions retain agent-chosen order and automatic per-shot motion
        run: python3 apps/ios/tests/run-property-video-planner.py --evidence-dir "$RUNNER_TEMP/rendprop-property-video-planner"
      - name: Video sources retain reviewed staged versions instead of newer previews
        run: python3 apps/ios/tests/run-staged-video-source.py --evidence-dir "$RUNNER_TEMP/rendprop-staged-video-source"
      - name: Finished property videos retain master selection and publication identity
        run: python3 apps/ios/tests/run-listing-video-native.py --evidence-dir "$RUNNER_TEMP/rendprop-listing-video-native"
      - name: Durable property video jobs retain admission, cancellation and same-job recovery
        run: python3 apps/ios/tests/run-property-video-jobs.py --evidence-dir "$RUNNER_TEMP/rendprop-property-video-jobs"
      - name: Native processor permission preserves saved jobs and durable withdrawal
        timeout-minutes: 5
        run: python3 apps/ios/tests/run-property-video-processors.py --output-dir "$RUNNER_TEMP/rendprop-property-video-processors" --controls
      - name: Photo orientation, crop confirmation and optional music preserve exact sources
        run: python3 apps/ios/tests/run-capture-orientation.py --evidence-dir "$RUNNER_TEMP/rendprop-capture-orientation"
      - name: Room tags require a real recorded or uploaded walkthrough
        run: python3 apps/ios/tests/run-room-tag-walkthrough.py --evidence-dir "$RUNNER_TEMP/rendprop-room-tag-walkthrough"
      - name: Large video batches retain every selected photo and recover both output formats
        run: python3 apps/ios/tests/run-reel-request-recovery.py --large-only --evidence-dir "$RUNNER_TEMP/rendprop-video-large"
      - name: Retain video purpose and buyer navigation regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: listing77-native-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rendprop-property-video-jobs/**
            ${{ runner.temp }}/rendprop-property-video-processors/receipt.json
            ${{ runner.temp }}/rendprop-property-video-processors/*/*.log
            ${{ runner.temp }}/rendprop-property-video-processors/*/*.swift
            ${{ runner.temp }}/rendprop-capture-orientation/**
            ${{ runner.temp }}/rendprop-room-tag-walkthrough/**
            ${{ runner.temp }}/rendprop-lead-inbox/receipt.json
            ${{ runner.temp }}/rendprop-lead-inbox/*.log
            ${{ runner.temp }}/rendprop-public-links/receipt.json
            ${{ runner.temp }}/rendprop-public-links/*.log
            ${{ runner.temp }}/rendprop-video-purpose/receipt.json
            ${{ runner.temp }}/rendprop-video-purpose/*.log
            ${{ runner.temp }}/rendprop-video-narration-readiness/receipt.json
            ${{ runner.temp }}/rendprop-video-narration-readiness/*/*.log
            ${{ runner.temp }}/rendprop-video-large/receipt.json
            ${{ runner.temp }}/rendprop-video-large/*.log
            ${{ runner.temp }}/rendprop-property-video-planner/receipt.json
            ${{ runner.temp }}/rendprop-property-video-planner/*.log
            ${{ runner.temp }}/rendprop-staged-video-source/receipt.json
            ${{ runner.temp }}/rendprop-staged-video-source/*.log
            ${{ runner.temp }}/rendprop-listing-video-native/receipt.json
            ${{ runner.temp }}/rendprop-listing-video-native/*.log
      - name: Reel completion notices and background expiry remain generation scoped
        run: python3 apps/ios/tests/run-reel-lifecycle.py --evidence-dir "$RUNNER_TEMP/rendprop-reel-lifecycle"
      - name: Global reel banner and completion taps preserve current job identity
        run: python3 apps/ios/tests/run-reel-work-integration.py --evidence-dir "$RUNNER_TEMP/rendprop-reel-work-integration"
      - name: Moving-photo work refuses changed account, consent and library contexts
        run: python3 apps/ios/tests/run-moving-photo-identity.py --evidence-dir "$RUNNER_TEMP/rendprop-moving-photo-identity"
      - name: Actual AVFoundation extraction handles downloaded MP4 bytes
        run: python3 apps/ios/tests/run-clip-frames.py --evidence-dir "$RUNNER_TEMP/rendprop-clip-frames"
      - name: Original photo motion preserves source pixels, orientation and geometry
        run: python3 apps/ios/tests/run-original-photo-motion.py --evidence-dir "$RUNNER_TEMP/rendprop-original-photo-motion"
      - name: Clean reel framing preserves intended crop, orientation and voice
        run: python3 apps/ios/tests/run-reel-whole-scene-framing.py --evidence-dir "$GITHUB_WORKSPACE/reel-whole-scene-framing-evidence"
      - name: Whole listing package preserves sources and refuses incomplete handovers
        run: python3 apps/ios/tests/run-listing-package-assembly.py --evidence-dir "$RUNNER_TEMP/rendprop-listing-package-assembly"
      - name: Retain whole listing package assembly and guard-removal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: listing-package-assembly-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rendprop-listing-package-assembly/receipt.json
            ${{ runner.temp }}/rendprop-listing-package-assembly/*.log
      - name: Reflection permission revocation fences pending requests
        run: python3 tools/audit/call-20260919/reflection-controller/run.py
      - name: Photo work survives navigation and fences account transitions
        run: bash apps/ios/tests/run-photo-work-queue.sh
      - name: Photo edit lifecycle and background resource cleanup
        run: bash apps/ios/tests/run-photo-edit-lifecycle.sh
      - name: Exact saved photo requests survive lost answers and quality pauses
        run: python3 apps/ios/tests/run-photo-pending-edit.py
      - name: Custom photo prompt delivery and native review controls
        run: python3 apps/ios/tests/run-custom-photo-prompt.py
      - name: Owner-bound Apple sign-in code and export admission
        run: |
          python3 tools/audit/apple-code-session-20261004/run.py
          for fault in drop-dispatch-fences drop-receipt-fences legacy-rebind drop-exchange-fence; do
            python3 tools/audit/apple-code-session-20261004/run.py --inject-fault "$fault"
          done
          python3 tools/audit/native-media-export-20261004/run.py
          for fault in drop-permission-context drop-listing-binding drop-csv-context drop-completion-context drop-presentation-actor drop-presentation-workspace drop-custom-download-review; do
            python3 tools/audit/native-media-export-20261004/run.py --inject-fault "$fault"
          done
      - name: Ordinary listing intent and shared-version review
        run: |
          python3 tools/audit/listing-facts-sync-20261004/run.py
          for fault in broad-wire wrong-workspace late-conflict drop-receipt-scope drop-archive-restore sold-strings-only sold-wide-tolerance sold-canonical-baseline sold-clear-newer; do
            python3 tools/audit/listing-facts-sync-20261004/run.py --inject-fault "$fault"
          done
          python3 tools/audit/listing-facts-review-20261004/run.py --output-dir "$RUNNER_TEMP/rendprop-listing-facts-review-positive"
          for fault in drop-review-context expose-private-details; do
            python3 tools/audit/listing-facts-review-20261004/run.py --inject-fault "$fault" --output-dir "$RUNNER_TEMP/rendprop-listing-facts-review-$fault"
          done
      - name: Create receipts retire consumed intent and preserve newer edits
        run: |
          python3 tools/audit/listing-create-intent-20261004/run.py
          for fault in revive-replay-intent drop-replay-base retain-consumed-address drop-archive-restore; do
            python3 tools/audit/listing-create-intent-20261004/run.py --expect-regression --inject-fault "$fault"
          done
      - name: Native forms retain opened intent, exact cents and workspace binding
        run: |
          python3 tools/audit/listing-form-intent-20261004/run.py
          for fault in broad-form fresh-baseline price-rounding; do
            python3 tools/audit/listing-form-intent-20261004/run.py --inject-fault "$fault"
          done
      - name: Legacy photo galleries, cover review and per-family selection
        run: |
          python3 tools/audit/photo-gallery-reconciliation-20261004/run.py
          for fault in drop-legacy-reconciliation bypass-stage-review latest-as-cover blank-family-badges; do
            python3 tools/audit/photo-gallery-reconciliation-20261004/run.py --inject-fault "$fault"
          done
      - name: Listing unit fields and real estate metadata survive editing
        run: bash apps/ios/tests/run-listing-unit-form.sh
      - name: Owner cohort metrics preserve numeric wire keys
        run: bash apps/ios/tests/run-admin-cohort-decoding.sh --negative-controls
      - name: Floor measurements preserve dimensions, layout and wire data
        run: |
          bash apps/ios/tests/run-floor-measurements.sh
          python3 apps/ios/tests/check-floor-measurement-controls.py
          python3 tools/audit/floor-measurement-outline-editor-20261004/run.py
          for fault in drop-original-geometry drop-original-vector drop-save-fence; do
            python3 tools/audit/floor-measurement-outline-editor-20261004/run.py --inject-fault "$fault"
          done
          python3 tools/audit/floor-measurement-sync-20261004/run.py
          sync_failed=0
          sync_pids=()
          sync_faults=()
          sync_log_dir="$(mktemp -d "$RUNNER_TEMP/rendprop-floor-measurement-sync-launch-XXXXXX")"
          wait_sync_batch() {
            for i in "${!sync_pids[@]}"; do
              if wait "${sync_pids[$i]}"; then
                printf '%s exit=0\n' "${sync_faults[$i]}"
              else
                sync_status=$?
                printf '%s exit=%s\n' "${sync_faults[$i]}" "$sync_status"
                sync_failed=1
              fi
              if ! cat "$sync_log_dir/${sync_faults[$i]}.log"; then
                sync_failed=1
              fi
            done
            sync_pids=()
            sync_faults=()
          }
          for fault in drop-wire drop-fingerprint ignore-dirty drop-replay-adopt rewrite-raw-keys legacy-ignore-edit discard-outline-only outline-fingerprint legacy-v2-accept drop-local-raw-mirror omit-cas-base ignore-pending-measurements wrong-cas-workspace ignore-cas-conflict omit-facts-fingerprint ignore-facts-review skip-legacy-recovery ignore-cas-lineage overwrite-shared-backup compare-backup-wire-only retain-backup-after-new-edit; do
            python3 tools/audit/floor-measurement-sync-20261004/run.py --inject-fault "$fault" >"$sync_log_dir/$fault.log" 2>&1 &
            sync_pids+=("$!")
            sync_faults+=("$fault")
            if [ "${#sync_pids[@]}" -eq 1 ]; then wait_sync_batch; fi
          done
          if [ "${#sync_pids[@]}" -gt 0 ]; then wait_sync_batch; fi
          [ "$sync_failed" -eq 0 ]
