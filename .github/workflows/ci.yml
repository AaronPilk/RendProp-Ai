  worker-edge:
    name: Cloudflare Worker (tour-host)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: services/edge/tour-host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/edge/tour-host/package-lock.json

      # Reproducibility: this is exactly the failure P0-8 was about — a missing
      # lockfile meant a clean install didn't resolve.
      - name: npm ci (clean, lockfile-driven)
        run: npm ci
      - name: Private measurement drafts stay out of public listing facts
        run: node --test ../../supabase/functions/tours/public-details-renderer-check.mjs

      - name: Typecheck
        run: npm run typecheck

      # The MLS compliance gate. /u/<slug> is the only URL an agent may paste
      # into an MLS unbranded virtual-tour field; those rules ban agent/broker
      # identification, contact forms, social profiles and external links, and
      # branding violations are fined (RI Statewide MLS: $50 first offence,
      # escalating). scripts/check-unbranded.mjs renders the real renderer with
      # sentinel-loaded branded fields and fails on any leak.
      # npm test also runs check:thumbnails: unit boundaries, the actual Worker
      # runtime and real codec/geometry checks, using the locked native tools.
      - name: Public pages, media delivery and thumbnail checks
        run: npm test

      - name: Bundle (deploy --dry-run, no credentials needed)
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry

      # Keep this fast runtime-only check. The separate Dependency security
      # workflow audits every tracked npm project, including development tools.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Run real H.264/AAC gates in the full browser bundled with the locked
      # Playwright version, rather than an independently installed system Chrome.
      - name: Install locked Studio dependencies for the media export gate
        working-directory: apps/studio
        run: npm ci --ignore-scripts
      - name: Verify locked full Chromium and synthetic media tools
        working-directory: apps/studio
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install chromium --no-shell
          browser_path="$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath());")"
          test -x "$browser_path"
          "$browser_path" --version
          printf 'STUDIO_BROWSER_EXECUTABLE=%s\n' "$browser_path" >> "$GITHUB_ENV"
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Published listing navigation and opt-in video delivery
        working-directory: .
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          npm ci --ignore-scripts --prefix services/edge/tour-host
          node services/edge/tour-host/scripts/check-listing-browser.mjs
          node services/edge/tour-host/scripts/check-listing-browser.mjs --chapter-observation-delay-ms=350 --evidence="$RUNNER_TEMP/rendprop-listing-browser-delayed-chapter"
      - name: Property website galleries and photo-based video delivery
        working-directory: .
        timeout-minutes: 10
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          node services/edge/tour-host/scripts/check-property-site-browser.mjs --evidence="$RUNNER_TEMP/rendprop-property-site-browser"
          control_dir="$RUNNER_TEMP/rendprop-property-site-browser-omit-preview-offset"
          test ! -e "$control_dir"
          preview_control_status=0
          node services/edge/tour-host/scripts/check-property-site-browser.mjs --fault=omit-preview-offset --evidence="$control_dir" || preview_control_status=$?
          test "$preview_control_status" -eq 1
          node --input-type=module - "$control_dir/failure.json" <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, lstatSync, readFileSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          const path = process.argv[2], file = lstatSync(path);
          assert(file.isFile() && !file.isSymbolicLink() && file.size <= 2 * 1024 ** 2, 'bounded regular omission receipt');
          assert(!existsSync(join(dirname(path), 'receipt.json')), 'no positive receipt for omission');
          const q = JSON.parse(readFileSync(path, 'utf8'));
          assert.equal(q.passed, false);
          assert.equal(q.error, 'scripted/signature-estate/home/390/preview: script-enabled main target clears actual sticky navigation/preview chrome');
          assert(Array.isArray(q.errors) && q.errors.length === 0, 'no runtime errors');
          assert(Array.isArray(q.checks) && q.checks.every(x => typeof x === 'string'));
          assert(q.checks.includes('scripted/signature-estate/home/390/preview: native Enter focuses main with JavaScript enabled'), 'native main focus passed before refusal');
          assert(Array.isArray(q.measurements));
          const witnesses = q.measurements.filter(x => x.tag === 'scripted/signature-estate/home/390/preview' && x.type === 'scripted-skip-clearance');
          assert.equal(witnesses.length, 1);
          const g = witnesses[0];
          assert.equal(q.measurements.at(-1), g, 'failure immediately follows recorded geometry');
          assert(g.active === true && g.top === 72 && g.obstruction === 74 && g.scrollMargin === '72px' && g.top < g.obstruction - 1, 'exact retained72/74 strict clearance failure');
          assert(Array.isArray(g.surfaces) && g.surfaces.length === 2);
          const banners = g.surfaces.filter(x => x.selector === '.property-preview-banner'), navs = g.surfaces.filter(x => x.selector === '#listing-nav');
          assert.equal(banners.length, 1); assert.equal(navs.length, 1);
          const banner = banners[0], nav = navs[0];
          assert(banner.position === 'sticky' && banner.top === 0 && banner.bottom === 74 && banner.height === 74, 'actual74px sticky preview banner');
          // A relative nav scrolls with the page, so its absolute viewport top
          // depends on the browser's final scroll position. Its size, position
          // mode and relationship to the focused main are the stable witness.
          assert(nav.position === 'relative' && nav.height === 56 && Number.isFinite(nav.top) && Number.isFinite(nav.bottom) && Math.abs(nav.bottom - nav.top - nav.height) < 0.5 && nav.bottom <= g.top, 'actual56px relative navigation precedes the focused main');
          console.log('Exact preview-offset omission witnessed: focused main72, sticky banner74, no runtime errors.');
          NODE
          node services/edge/tour-host/scripts/check-property-video-browser.mjs
          node services/edge/tour-host/scripts/check-property-video-controls.mjs
      - name: Chapter seek and Explore handoff reject missing seek, stale timing and rewind
        working-directory: .
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          for control in chapter-no-seek stale-explore-reference explore-rewind; do
            evidence_dir="$RUNNER_TEMP/rendprop-listing-browser-$control"
            set +e
            node services/edge/tour-host/scripts/check-listing-browser.mjs --fault="$control" --evidence="$evidence_dir"
            status=$?
            set -e
            test "$status" -eq 1
            LISTING_CONTROL="$control" LISTING_EVIDENCE="$evidence_dir" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const read = name => JSON.parse(readFileSync(process.env.LISTING_EVIDENCE + '/' + name));
          const receipt = read('receipt.json');
          assert.equal(receipt.fault, process.env.LISTING_CONTROL);
          assert.equal(receipt.passed, false);
          assert.deepEqual(receipt.pageErrors, []);
          if (receipt.fault === 'chapter-no-seek') {
            const chapter = read('chapter-observation.json');
            assert.equal(receipt.error, 'Room chapter seeks the actual media timeline');
            assert.ok(receipt.checks.includes('Native keyboard pause control works'));
            assert.equal(chapter.error, 'No chapter seek and decoded frame within 4000ms');
            assert.equal(chapter.seek, null);
            assert.equal(chapter.presented, null);
          } else {
            const handoff = read('explore-handoff.json');
            assert.equal(receipt.error, 'Returning to Explore pauses at the current playback position without losing the tour');
            assert.ok(receipt.checks.includes('Seeking yields a real nonempty decoded test-pattern frame'));
            assert.ok(handoff.afterExplore.paused && !handoff.afterExplore.controls && handoff.afterExplore.muted);
            assert.equal(handoff.afterExplore.currentSrc, handoff.handoff.currentSrc);
            if (receipt.fault === 'stale-explore-reference') {
              assert.ok(handoff.staleDelta > .2);
              assert.ok(Math.abs(handoff.handoffDelta) < handoff.toleranceSeconds);
            } else {
              assert.ok(Math.abs(handoff.handoffDelta) > 1);
            }
          }
          console.log('Browser negative control rejected at its intended assertion:', receipt.fault);
          JS
          done
      - name: Actual native and worker HD master encoding
        working-directory: .
        timeout-minutes: 10
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 tools/audit/run_render_quality.py
          python3 tools/audit/run_render_review_fences.py
      - name: Retain media export receipts and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tour-host-browser-native-quality-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rendprop-property-site-browser/**
            ${{ runner.temp }}/rendprop-property-site-browser-omit-preview-offset/**
            ${{ runner.temp }}/rendprop-property-video-*/**
            ${{ runner.temp }}/rendprop-listing-browser-*/receipt.json
            ${{ runner.temp }}/rendprop-listing-browser-*/explore-handoff.json
            ${{ runner.temp }}/rendprop-listing-browser-*/chapter-seek.json
            ${{ runner.temp }}/rendprop-listing-browser-*/chapter-observation.json
            ${{ runner.temp }}/rendprop-listing-browser-*/playback-clock.json
            ${{ runner.temp }}/rendprop-listing-browser-*/decoded-frame.json
            ${{ runner.temp }}/rendprop-listing-browser-*/*.png
            ${{ runner.temp }}/rendprop-listing-browser-*/*.mp4
            ${{ runner.temp }}/rendprop-render-concurrency-hd-*/receipt.json
            ${{ runner.temp }}/rendprop-render-concurrency-hd-*/*.log
            ${{ runner.temp }}/rendprop-render-concurrency-hd-*/**/*.json
            ${{ runner.temp }}/rendprop-render-concurrency-hd-*/failure-evidence/*.mp4
            ${{ runner.temp }}/rendprop-render-review-fences-*/receipt.json
            ${{ runner.temp }}/rendprop-render-review-fences-*/*.log
          retention-days: 7
          if-no-files-found: warn

  studio-media-tools:
    # Normal vendor installation happens here, never on the timing runner.
    name: Prepare exact native media cache
    runs-on: macos-26
    permissions:
      contents: read
    env:
      MEDIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MEDIA_WORKFLOW_SHA: ${{ github.workflow_sha }}
    outputs:
      manifest-sha256: ${{ steps.snapshot.outputs.manifest-sha256 }}
      cache-paths: ${{ steps.snapshot.outputs.cache-paths }}
      cache-key: ${{ steps.snapshot.outputs.cache-key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Validate native cache boundaries with closed fixtures
        timeout-minutes: 2
        run: node --test tools/ci/native-media-cache.test.mjs tools/ci/browser-signature-policy.test.mjs
      - name: Install locked dependencies for media preparation
        working-directory: apps/studio
        run: npm ci --ignore-scripts
      - name: Verify locked full Chromium and synthetic media tools
        timeout-minutes: 10
        working-directory: apps/studio
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install chromium --no-shell
          browser_path="$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath());")"
          test -x "$browser_path"
          # This pinned vendor build has ad-hoc code signatures and no resource seal.
          # Cache integrity still covers every resource byte; this is no publisher claim.
          browser_app="${browser_path%/Contents/MacOS/*}"
          browser_signature="$(/usr/bin/codesign --display --verbose=4 "$browser_app" 2>&1)"
          printf '%s\n' "$browser_signature" | node ../../tools/ci/browser-signature-policy.mjs --executable "$browser_path"
          /usr/bin/codesign --verify --deep --strict --ignore-resources "$browser_app"
          test "$("$browser_path" --version | sed 's/[[:space:]]*$//')" = "Google Chrome for Testing 153.0.8010.12"
          printf 'STUDIO_BROWSER_EXECUTABLE=%s\n' "$browser_path" >> "$GITHUB_ENV"
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
          test "$(ffmpeg -version | sed -n '1p')" = "ffmpeg version 9.0.2 Copyright (c) 2000-2026 the FFmpeg developers"
          test "$(ffprobe -version | sed -n '1p')" = "ffprobe version 9.0.2 Copyright (c) 2007-2026 the FFmpeg developers"
          test "$(/opt/homebrew/bin/brew --prefix ffmpeg)" = /opt/homebrew/opt/ffmpeg
      - name: Snapshot exact native media files and preparation identity
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MEDIA_SOURCE_SHA"
          export MEDIA_NATIVE_FORMULAE="$(printf 'ffmpeg\n'; /opt/homebrew/bin/brew deps --formula --installed ffmpeg)"
          node tools/ci/native-media-cache.mjs record
      - name: Save verified native media cache before any timing gate
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        with:
          path: ${{ steps.snapshot.outputs.cache-paths }}
          key: ${{ steps.snapshot.outputs.cache-key }}
      - name: Confirm exact cache was saved
        id: saved
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        with:
          path: ${{ steps.snapshot.outputs.cache-paths }}
          key: ${{ steps.snapshot.outputs.cache-key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Require exact immutable preparation cache
        shell: bash
        env:
          CACHE_HIT: ${{ steps.saved.outputs.cache-hit }}
          CACHE_MATCH: ${{ steps.saved.outputs.cache-matched-key }}
          EXPECTED_CACHE_KEY: ${{ steps.snapshot.outputs.cache-key }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          test "$CACHE_MATCH" = "$EXPECTED_CACHE_KEY"
      - name: Retain native media preparation manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-media-cache-preparation-${{ github.run_attempt }}
          path: .ci-media-cache/manifest.json
          retention-days: 7
          if-no-files-found: warn

  studio-media-export:
    # Let the other Mac audit, photo, reel and Worker jobs finish before a
    # real-time browser capture starts. These jobs use distinct hosted VMs, so
    # shared host contention is unproven; their overlap is avoidable. Keep the
    # media gate independent of their results so its coverage survives a failure.
    name: Studio media exports and native audio timing
    runs-on: macos-26
    needs: [studio-media-tools, native-audit-required, worker-edge]
    if: ${{ always() && !cancelled() && needs.studio-media-tools.result == 'success' }}
    env:
      MEDIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MEDIA_WORKFLOW_SHA: ${{ github.workflow_sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Install locked Studio dependencies for the media export gate
        working-directory: apps/studio
        run: npm ci --ignore-scripts
      - name: Validate bounded media runner readiness controls
        timeout-minutes: 1
        run: node --test tools/ci/media-runner-ready.test.mjs
      - name: Restore exact same-run native media cache
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        with:
          path: ${{ needs.studio-media-tools.outputs.cache-paths }}
          key: ${{ needs.studio-media-tools.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Require exact hit and verify every restored native file before execution
        id: verified-native
        shell: bash
        env:
          CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
          CACHE_MATCH: ${{ steps.native-cache.outputs.cache-matched-key }}
          EXPECTED_CACHE_KEY: ${{ needs.studio-media-tools.outputs.cache-key }}
          EXPECTED_MANIFEST_SHA: ${{ needs.studio-media-tools.outputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MEDIA_SOURCE_SHA"
          test "$CACHE_HIT" = true
          test "$CACHE_MATCH" = "$EXPECTED_CACHE_KEY"
          node tools/ci/native-media-cache.mjs verify --expected-sha256 "$EXPECTED_MANIFEST_SHA"
      - name: Verify restored full Chromium and synthetic media tools
        timeout-minutes: 2
        shell: bash
        env:
          VERIFIED_BROWSER: ${{ steps.verified-native.outputs.browser-executable }}
        run: |
          set -euo pipefail
          test -x "$VERIFIED_BROWSER"
          # Require the exact upstream unsealed variant before code-only validation.
          # The preceding full-cache audit verifies every resource, link and byte.
          browser_app="${VERIFIED_BROWSER%/Contents/MacOS/*}"
          browser_signature="$(/usr/bin/codesign --display --verbose=4 "$browser_app" 2>&1)"
          printf '%s\n' "$browser_signature" | node tools/ci/browser-signature-policy.mjs --executable "$VERIFIED_BROWSER"
          /usr/bin/codesign --verify --deep --strict --ignore-resources "$browser_app"
          test "$("$VERIFIED_BROWSER" --version | sed 's/[[:space:]]*$//')" = "Google Chrome for Testing 153.0.8010.12"
          printf 'STUDIO_BROWSER_EXECUTABLE=%s\n' "$VERIFIED_BROWSER" >> "$GITHUB_ENV"
          printf '/opt/homebrew/bin\n' >> "$GITHUB_PATH"
          /usr/bin/codesign --verify --strict /opt/homebrew/bin/ffmpeg
          /usr/bin/codesign --verify --strict /opt/homebrew/bin/ffprobe
          /opt/homebrew/bin/ffmpeg -version
          /opt/homebrew/bin/ffprobe -version
          test "$(/opt/homebrew/bin/ffmpeg -version | sed -n '1p')" = "ffmpeg version 9.0.2 Copyright (c) 2000-2026 the FFmpeg developers"
          test "$(/opt/homebrew/bin/ffprobe -version | sed -n '1p')" = "ffprobe version 9.0.2 Copyright (c) 2007-2026 the FFmpeg developers"
      - name: Record observed isolated media runner capacity
        working-directory: apps/studio
        timeout-minutes: 1
        run: |
          node --input-type=module - "$RUNNER_TEMP/studio-media-export-runner-facts.json" <<'JSRUNNER'
          import { writeFileSync } from 'node:fs';
          import os from 'node:os';
          import { quickLoad } from './tests/runner-facts.mjs';
          const facts = { platform: process.platform, arch: process.arch, nodeVersion: process.version,
            cpus: os.cpus().length, totalmem: os.totalmem(), ...quickLoad(),
            scope: 'Observed before isolated media gates; capacity does not establish a timing cause' };
          writeFileSync(process.argv[2], JSON.stringify(facts, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          JSRUNNER
      # Environment admission only. The media tests below still execute once
      # with their original clock, refusal controls and time limits. Use the
      # runner's virtual default output device, matching production AudioContext
      # construction; the silent sink has a separate scheduling path.
      - name: Require bounded recorded media runner readiness
        timeout-minutes: 6
        run: node tools/ci/media-runner-ready.mjs --output "$RUNNER_TEMP/studio-media-export-readiness.json"
      # Run the real editor export while the admitted runner is still fresh.
      # The later historical fault controls deliberately consume encoder and
      # virtual-audio capacity; they retain all of their existing assertions.
      - name: Studio cloud editor, conversation and finishing exports
        working-directory: apps/studio
        timeout-minutes: 10
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          node tests/cloud-editor-browser.mjs
          node tests/conversation-browser.mjs
          node tests/finishing-audio-probe-controls.mjs
          node tests/finishing-browser.mjs
      - name: Studio waits for advancing audio before recording content
        working-directory: apps/studio
        timeout-minutes: 3
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          node tests/export-startup-browser.mjs
          control_root=$(mktemp -d "$RUNNER_TEMP/rendprop-export-startup-control.XXXXXX")
          set +e
          TMPDIR="$control_root" node tests/export-startup-browser.mjs --fault=omit-readiness > "$control_root/run.log" 2>&1
          control_status=$?
          set -e
          test "$control_status" -eq 1
          python3 - "$control_root" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          receipts = list(Path(sys.argv[1]).glob('rendprop-export-startup-*/receipt.json'))
          assert len(receipts) == 1, receipts
          receipt = json.loads(receipts[0].read_text())
          assert receipt['status'] == 'failed' and receipt['mode'] == '--fault=omit-readiness'
          assert receipt['audioOutput']['testOnly'] is True
          assert receipt['audioOutput'] == {
              'mode': 'default-device', 'testOnly': True,
              'helperSha256': hashlib.sha256(Path('tests/export-audio-output.mjs').read_bytes()).hexdigest(),
          }
          assert receipt['sourceBoundAtEnd'] is True
          assert receipt['errors'] == [] and receipt['externalRequests'] == []
          assert receipt['failure'].startswith('AssertionError [ERR_ASSERTION]: Content and recording must not start while startup clock is frozen')
          forbidden = {'recorder.start', 'user.buffer.start', 'user.video.play'}
          assert any(event.get('held') is True and event['kind'] in forbidden
                     for event in receipt['failureSnapshot']['events'])
          print('Omitted readiness reaches the intended pre-content timing assertion')
          PY
      - name: Studio original audio and timing controls
        working-directory: apps/studio
        timeout-minutes: 10
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          node tests/export-audio-browser.mjs
          if node tests/export-audio-browser.mjs --fault=live-original-audio > "$RUNNER_TEMP/export-original-audio-defect.log" 2>&1; then
            echo "::error::Original-audio regression control unexpectedly passed"
            exit 1
          fi
          grep -q "Continuous speech through cutaway boundaries: weakest40ms RMS" "$RUNNER_TEMP/export-original-audio-defect.log"
          if node tests/export-audio-browser.mjs --fault=late-buffered-wall-origin > "$RUNNER_TEMP/export-clock-origin-defect.log" 2>&1; then
            echo "::error::Buffered-audio clock-origin regression control unexpectedly passed"
            exit 1
          fi
          grep -q "Audio and picture timing drifted during export" "$RUNNER_TEMP/export-clock-origin-defect.log"
          if node tests/export-audio-browser.mjs --fault=omit-bucket-pacing > "$RUNNER_TEMP/export-paint-budget-defect.log" 2>&1; then
            echo "::error::Redundant-paint regression control unexpectedly passed"
            exit 1
          fi
          grep -q "Duplicate30fps timeline bucket was repainted" "$RUNNER_TEMP/export-paint-budget-defect.log"
          control_root=$(mktemp -d "$RUNNER_TEMP/rendprop-export-optional-control.XXXXXX")
          set +e
          TMPDIR="$control_root" node tests/export-audio-browser.mjs --alignment-only --fault=late-optional-track-schedule > "$control_root/run.log" 2>&1
          control_status=$?
          set -e
          test "$control_status" -eq 1
          python3 - "$control_root" <<'PYCONTROL'
          import hashlib, json, sys
          from pathlib import Path
          receipts = list(Path(sys.argv[1]).glob('rendprop-export-original-audio-*/receipt.json'))
          assert len(receipts) == 1, receipts
          receipt = json.loads(receipts[0].read_text())
          assert receipt['status'] == 'failed' and receipt['fault'] == '--fault=late-optional-track-schedule'
          assert receipt['audioOutput']['testOnly'] is True
          assert receipt['audioOutput'] == {
              'mode': 'default-device', 'testOnly': True,
              'helperSha256': hashlib.sha256(Path('tests/export-audio-output.mjs').read_bytes()).hexdigest(),
          }
          assert receipt['errors'] == [] and receipt['externalRequests'] == []
          assert receipt['failure'].startswith('AssertionError [ERR_ASSERTION]: Narration onset must honor its saved offset before delayed play delivery')
          assert len(receipt['cases']) == 1
          case = receipt['cases'][0]
          assert case['name'] == 'alignment-opening' and case['ok'] is True
          assert len(case['playEvidence']) == 2
          assert case['playEvidence'][1]['media'] - case['playEvidence'][0]['media'] > .15
          assert case['pcm']['voiceRef'] > .15
          assert case['pcm']['voiceEarly'] <= case['pcm']['voiceRef'] * .7
          assert abs(float(case['probe']['format']['duration']) - 2) < .18
          assert sum(x['codec_type'] == 'audio' and x['codec_name'] == 'aac' for x in case['probe']['streams']) == 1
          expected = {'tests/export-audio-fixture.ts', 'tests/export-audio-browser.mjs'}
          expected.update(f'src/editor/{name}.ts' for name in ('export', 'recording-clock', 'media', 'model', 'music', 'finishing'))
          assert set(receipt['sourceHashes']) == expected
          for path, digest in receipt['sourceHashes'].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          print('Late optional-track control reaches its encoded narration-onset assertion')
          PYCONTROL
          # Bind every healthy and fault invocation to the production output transport.
          python3 - "$RUNNER_TEMP" <<'PYAUDIOOUTPUT'
          import hashlib, json, sys
          from pathlib import Path
          base = Path(sys.argv[1])
          expected_audio = {
              'mode': 'default-device', 'testOnly': True,
              'helperSha256': hashlib.sha256(Path('tests/export-audio-output.mjs').read_bytes()).hexdigest(),
          }
          groups = (
              ('startup healthy', 'rendprop-export-startup-*/receipt.json', 1),
              ('startup omission', 'rendprop-export-startup-control.*/rendprop-export-startup-*/receipt.json', 1),
              ('original audio healthy and faults', 'rendprop-export-original-audio-*/receipt.json', 4),
              ('optional schedule omission', 'rendprop-export-optional-control.*/rendprop-export-original-audio-*/receipt.json', 1),
              ('cloud editor', 'rendprop-cloud-editor-*/receipt.json', 1),
              ('conversation', 'rendprop-conversation-*/receipt.json', 1),
              ('finishing', 'rendprop-finishing-*/receipt.json', 1),
          )
          bindings = []
          for name, pattern, count in groups:
              paths = sorted(base.glob(pattern))
              if name == 'finishing':
                  # The separate unchanged AAC probe has no browser AudioContext.
                  paths = [path for path in paths
                           if not path.parent.name.startswith('rendprop-finishing-audio-probe-')]
              assert len(paths) == count, (name, len(paths), count)
              for path in paths:
                  raw = path.read_bytes()
                  receipt = json.loads(raw)
                  assert receipt['audioOutput']['testOnly'] is True, (name, path)
                  assert receipt['audioOutput'] == expected_audio, (name, path)
                  bindings.append({'suite': name, 'receipt': str(path.relative_to(base)),
                                   'receiptSha256': hashlib.sha256(raw).hexdigest()})
          assert len(bindings) == len({row['receipt'] for row in bindings}) == 10
          with (base / 'studio-audio-output-bindings.json').open('x') as output:
              json.dump({'audioOutput': expected_audio, 'invocationCount': 10, 'receipts': bindings}, output, indent=2)
          print('All10 media export invocation receipts use the production default-device transport')
          PYAUDIOOUTPUT
      - name: Retain media export receipts and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-isolated-media-export-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/studio-audio-output-bindings.json
            ${{ runner.temp }}/rendprop-export-original-audio-*/receipt.json
            ${{ runner.temp }}/rendprop-export-original-audio-*/*.mp4
            ${{ runner.temp }}/export-original-audio-defect.log
            ${{ runner.temp }}/rendprop-cloud-editor-*/receipt.json
            ${{ runner.temp }}/rendprop-cloud-editor-*/*.png
            ${{ runner.temp }}/rendprop-cloud-editor-*/*.mp4
            ${{ runner.temp }}/rendprop-conversation-*/receipt.json
            ${{ runner.temp }}/rendprop-conversation-*/*.png
            ${{ runner.temp }}/rendprop-conversation-*/*.mp4
            ${{ runner.temp }}/rendprop-export-startup-*/receipt.json
            ${{ runner.temp }}/rendprop-export-startup-*/*.mp4
            ${{ runner.temp }}/rendprop-export-startup-*/*.webm
            ${{ runner.temp }}/rendprop-export-startup-control.*/run.log
            ${{ runner.temp }}/rendprop-export-startup-control.*/rendprop-export-startup-*/receipt.json
            ${{ runner.temp }}/export-clock-origin-defect.log
            ${{ runner.temp }}/export-paint-budget-defect.log
            ${{ runner.temp }}/rendprop-export-optional-control.*/run.log
            ${{ runner.temp }}/rendprop-export-optional-control.*/rendprop-export-original-audio-*/receipt.json
            ${{ runner.temp }}/rendprop-export-optional-control.*/rendprop-export-original-audio-*/*.mp4
            ${{ runner.temp }}/rendprop-finishing-*/receipt.json
            ${{ runner.temp }}/rendprop-finishing-*/*.png
            ${{ runner.temp }}/rendprop-finishing-*/*.mp4
            ${{ runner.temp }}/studio-media-export-runner-facts.json
            ${{ runner.temp }}/studio-media-export-readiness.json
            .ci-media-cache/manifest.json
          retention-days: 7
          if-no-files-found: warn

  studio-media-resume:
    # Give the default-device MP4 clock gate a fresh hosted Mac and its own
    # bounded admission. Start after the other Mac jobs and the cloud export
    # job finish, even if one of those independent gates fails, so both media
    # suites still report their own result without competing for capture time.
    name: Studio MP4 resume and AAC native timing
    runs-on: macos-26
    needs: [studio-media-tools, native-audit-required, worker-edge, studio-media-export]
    if: ${{ always() && !cancelled() && needs.studio-media-tools.result == 'success' }}
    env:
      MEDIA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MEDIA_WORKFLOW_SHA: ${{ github.workflow_sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Install locked Studio dependencies for the media export gate
        working-directory: apps/studio
        run: npm ci --ignore-scripts
      - name: Validate bounded media runner readiness controls
        timeout-minutes: 1
        run: node --test tools/ci/media-runner-ready.test.mjs
      - name: Restore exact same-run native media cache
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        with:
          path: ${{ needs.studio-media-tools.outputs.cache-paths }}
          key: ${{ needs.studio-media-tools.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Require exact hit and verify every restored native file before execution
        id: verified-native
        shell: bash
        env:
          CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
          CACHE_MATCH: ${{ steps.native-cache.outputs.cache-matched-key }}
          EXPECTED_CACHE_KEY: ${{ needs.studio-media-tools.outputs.cache-key }}
          EXPECTED_MANIFEST_SHA: ${{ needs.studio-media-tools.outputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MEDIA_SOURCE_SHA"
          test "$CACHE_HIT" = true
          test "$CACHE_MATCH" = "$EXPECTED_CACHE_KEY"
          node tools/ci/native-media-cache.mjs verify --expected-sha256 "$EXPECTED_MANIFEST_SHA"
      - name: Verify restored full Chromium and synthetic media tools
        timeout-minutes: 2
        shell: bash
        env:
          VERIFIED_BROWSER: ${{ steps.verified-native.outputs.browser-executable }}
        run: |
          set -euo pipefail
          test -x "$VERIFIED_BROWSER"
          # Require the exact upstream unsealed variant before code-only validation.
          # The preceding full-cache audit verifies every resource, link and byte.
          browser_app="${VERIFIED_BROWSER%/Contents/MacOS/*}"
          browser_signature="$(/usr/bin/codesign --display --verbose=4 "$browser_app" 2>&1)"
          printf '%s\n' "$browser_signature" | node tools/ci/browser-signature-policy.mjs --executable "$VERIFIED_BROWSER"
          /usr/bin/codesign --verify --deep --strict --ignore-resources "$browser_app"
          test "$("$VERIFIED_BROWSER" --version | sed 's/[[:space:]]*$//')" = "Google Chrome for Testing 153.0.8010.12"
          printf 'STUDIO_BROWSER_EXECUTABLE=%s\n' "$VERIFIED_BROWSER" >> "$GITHUB_ENV"
          printf '/opt/homebrew/bin\n' >> "$GITHUB_PATH"
          /usr/bin/codesign --verify --strict /opt/homebrew/bin/ffmpeg
          /usr/bin/codesign --verify --strict /opt/homebrew/bin/ffprobe
          /opt/homebrew/bin/ffmpeg -version
          /opt/homebrew/bin/ffprobe -version
          test "$(/opt/homebrew/bin/ffmpeg -version | sed -n '1p')" = "ffmpeg version 9.0.2 Copyright (c) 2000-2026 the FFmpeg developers"
          test "$(/opt/homebrew/bin/ffprobe -version | sed -n '1p')" = "ffprobe version 9.0.2 Copyright (c) 2007-2026 the FFmpeg developers"
      - name: Require bounded recorded media runner readiness for MP4 timing
        timeout-minutes: 6
        run: node tools/ci/media-runner-ready.mjs --output "$RUNNER_TEMP/studio-media-resume-readiness.json"
      - name: Studio MP4 resume, AAC narration and timing controls
        working-directory: apps/studio
        timeout-minutes: 10
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          node tests/export-resume-browser.mjs
          control_root=$(mktemp -d "$RUNNER_TEMP/rendprop-export-resume-control.XXXXXX")
          set +e
          TMPDIR="$control_root" node tests/export-resume-browser.mjs --fault=omit-old-await > "$control_root/run.log" 2>&1
          control_status=$?
          set -e
          test "$control_status" -eq 1
          python3 - "$control_root" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          receipts = list(Path(sys.argv[1]).glob('rendprop-export-resume-*/receipt.json'))
          assert len(receipts) == 1, receipts
          receipt = json.loads(receipts[0].read_text())
          assert receipt['status'] == 'failed' and receipt['fault'] == 'omit-old-await'
          assert receipt['audioOutput']['testOnly'] is True
          assert receipt['audioOutput'] == {
              'mode': 'default-device', 'testOnly': True,
              'helperSha256': hashlib.sha256(Path('tests/export-audio-output.mjs').read_bytes()).hexdigest(),
          }
          assert receipt['variants'] == ['baseline']
          assert receipt['failure'].startswith('AssertionError [ERR_ASSERTION]: Negative control must reproduce drift with the old await:')
          assert receipt['errors'] == [] and receipt['externalRequests'] == []
          assert len(receipt['attempts']) == len(receipt['runs']) == 1
          attempt, run = receipt['attempts'][0], receipt['runs'][0]
          assert attempt['error'] is None and attempt['tracks'] and all(track == 'ended' for track in attempt['tracks'])
          assert run['variant'] == 'baseline' and run['narrated'] is True
          assert 0 < run['duration'] <= 3.4
          assert not any(event.get('event') == 'resume.delivered' for event in run['trace'])
          fixture_input = receipts[0].parent / 'opening-tone-video.mp4'
          assert fixture_input.is_file()
          outputs = [path for path in receipts[0].parent.glob('*.mp4') if path != fixture_input]
          assert len(outputs) == 1 and outputs[0].name == 'baseline-narrated.mp4'
          assert Path(run['output']).resolve() == outputs[0].resolve()
          expected_sources = {'tests/export-resume-browser.mjs', 'tests/export-baseline-refusal.mjs',
                              'tests/export-diagnostics.mjs', 'tests/scheduling-probe.mjs', 'tests/native-trace-observer.mjs'}
          expected_sources.update(f'src/editor/{name}.ts' for name in
                                  ('export', 'recording-clock', 'media', 'model', 'music', 'finishing', 'overlay-renderer'))
          assert set(receipt['sourceHashes']) == expected_sources
          for path, digest in receipt['sourceHashes'].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          print('Omitted historical await reaches the intended bad-duration assertion')
          PY
      - name: Bind MP4 resume receipts to the production output transport
        working-directory: apps/studio
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP" <<'PYAUDIOOUTPUT'
          import hashlib, json, sys
          from pathlib import Path
          base = Path(sys.argv[1])
          expected_audio = {
              'mode': 'default-device', 'testOnly': True,
              'helperSha256': hashlib.sha256(Path('tests/export-audio-output.mjs').read_bytes()).hexdigest(),
          }
          groups = (
              ('resume healthy', 'rendprop-export-resume-*/receipt.json'),
              ('resume omission', 'rendprop-export-resume-control.*/rendprop-export-resume-*/receipt.json'),
          )
          bindings = []
          for name, pattern in groups:
              paths = sorted(base.glob(pattern))
              assert len(paths) == 1, (name, paths)
              path = paths[0]
              raw = path.read_bytes()
              receipt = json.loads(raw)
              assert receipt['audioOutput'] == expected_audio, (name, path)
              bindings.append({'suite': name, 'receipt': str(path.relative_to(base)),
                               'receiptSha256': hashlib.sha256(raw).hexdigest()})
          with (base / 'studio-media-resume-audio-output-bindings.json').open('x') as output:
              json.dump({'audioOutput': expected_audio, 'invocationCount': 2,
                         'receipts': bindings}, output, indent=2)
          print('Both MP4 resume receipts use the production default-device transport')
          PYAUDIOOUTPUT
      - name: Retain isolated MP4 resume receipts and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-isolated-mp4-resume-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/studio-media-resume-audio-output-bindings.json
            ${{ runner.temp }}/studio-media-resume-readiness.json
            ${{ runner.temp }}/rendprop-export-resume-*/receipt.json
            ${{ runner.temp }}/rendprop-export-resume-*/*.mp4
            ${{ runner.temp }}/rendprop-export-resume-control.*/run.log
            ${{ runner.temp }}/rendprop-export-resume-control.*/rendprop-export-resume-*/receipt.json
            ${{ runner.temp }}/rendprop-export-resume-control.*/rendprop-export-resume-*/*.mp4
            .ci-media-cache/manifest.json
          retention-days: 7
          if-no-files-found: warn

  upload-gateway:
    name: Cloudflare Worker (upload-gateway, deno check + tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Same exact pin as edge-functions.
          deno-version: "2.9.6"
      # The adapter and its tests import local sources plus the pinned std
      # assert module only. No network at runtime, no subprocess, no writes.
      - name: Run the gateway tests
        run: deno test --no-config --no-lock --deny-net --deny-run --deny-write --allow-read --allow-env services/edge/upload-gateway/
      # worker-configuration.d.ts is wrangler's generated Cloudflare runtime
      # typing and collides with Deno's own DOM lib, so the gateway's tsconfig
      # (lib: ES2022) has to be the config in force for the check to mean
      # anything; a wrong Env binding fails it, a Deno/Worker lib clash must not.
      - name: Typecheck the Worker entrypoint
        working-directory: services/edge/upload-gateway
        run: deno check --config tsconfig.json --no-lock --node-modules-dir=auto index.ts

  edge-functions:
    name: Supabase edge functions (deno check + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Exact pin (was the floating v2.x) — 2.9.6 is the latest 2.x release
          # and is what every edge-function test below was verified against.
          deno-version: "2.9.6"

      # Every function must typecheck. `me` once failed here on a WebCrypto
      # signature — exactly the class of bug this catches before deploy.
      - name: Typecheck every function
        working-directory: services/supabase/functions
        run: |
          echo '{"nodeModulesDir":"auto"}' > deno.json
          fail=0
          for d in */; do
            f="${d}index.ts"
            [ -f "$f" ] || continue
            [ "${d%/}" = "_shared" ] && continue
            if deno check "$f" >/tmp/out 2>&1; then
              echo "OK   ${d%/}"
            else
              echo "FAIL ${d%/}"; sed -n '1,25p' /tmp/out; fail=1
            fi
          done
          exit $fail

      # Hermetic edge-function tests. The SUMMARY line records the actual
      # inventory (1,521 passed in the October 5 local audit); do not treat
      # fixture-only checks as production/provider or camera acceptance.
      # A real local-SQL presenter controller case runs in its dedicated
      # disposable Postgres job instead of this unit-suite environment.
      # --node-modules-dir=auto (a flag, not a committed deno.json) lays out
      # node_modules for the `npm:` specifiers.
      # The recursive suite includes tours/photo-delivery.test.ts and
      # delivery-handler.test.ts; do not duplicate their authority checks.
      - name: Run edge function tests
        working-directory: services/supabase/functions
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          deno test --allow-all --node-modules-dir=auto . 2>&1 | tee /tmp/edge-function-tests.log
          summary=$(grep -E '^(ok|FAILED) \| [0-9]+ passed \| [0-9]+ failed' /tmp/edge-function-tests.log | tail -n 1)
          echo "SUMMARY: ${summary:-no Deno summary line found}"
          test -n "$summary"

      # The upload fixtures live in tools/audit (they double as offline audit
      # evidence) and reach this suite through three-line registration files
      # in uploads/. Run them directly too, by glob, so a fixture without a
      # registration file — renewal today, whatever comes next — still runs.
      - name: Run the tools/audit upload fixtures directly
        working-directory: services/supabase/functions
        run: deno test --allow-all --node-modules-dir=auto ../../../tools/audit/uploads_*_test.ts
      - name: Actual listing intent handler against closed transport
        run: deno run --cached-only --allow-env --allow-read tools/audit/listing-facts-handler-20261004.ts
      - name: Uppercase phone ids save facts; the 2026-10-11 503 stays reproduced by its negative control
        run: deno run --cached-only --allow-env --allow-read tools/audit/listing-uppercase-ids-20261011.ts
      - name: Build 58 Recently deleted routes (actual listings handler, own process)
        run: deno test --no-lock --allow-env --allow-read --allow-net=trash-fixture.invalid tools/audit/listing-trash-routes-20261011_test.ts
      - name: Build 58 republish-app route (actual renders handler, own process)
        run: deno test --no-lock --allow-env --allow-read --allow-net=republish-fixture.invalid tools/audit/renders-republish-route-20261011_test.ts

  db-migrations:
    name: Supabase migrations (fresh replay + invariants)
    runs-on: ubuntu-latest
    # A plain Postgres 16 stands in for the Supabase database: tests/ci-bootstrap.sql
    # recreates the slice the migrations depend on (API roles, auth schema,
    # auth.uid(), Supabase's default privileges). No credentials, no Docker-in-Docker.
    services:
      postgres:
        # Digest-pinned (audit supply-chain finding — a bare `postgres:16` tag
        # is mutable). Resolved 2026-09-07 from the live registry, and it is
        # the multi-arch index (covers linux/amd64, what ubuntu-latest runs):
        #   TOKEN=$(curl -sS 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/postgres:pull' | python3 -c "import json,sys;print(json.load(sys.stdin)['token'])")
        #   curl -sS -D - -o /dev/null -H "Authorization: Bearer $TOKEN" \
        #     -H 'Accept: application/vnd.oci.image.index.v1+json' \
        #     https://registry-1.docker.io/v2/library/postgres/manifests/16
        #   # -> docker-content-digest: sha256:...
        # Docker Hub refused the CI runner's unauthenticated pull on Oct 9.
        # Google's official cache returned this exact index with matching
        # Docker-Content-Digest AND independently computed SHA-256; same bits.
        # https://docs.cloud.google.com/artifact-registry/docs/pull-cached-dockerhub-images
        image: mirror.gcr.io/library/postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rendprop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: rendprop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: psql client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Bootstrap the Supabase baseline (roles, auth schema, default privileges)
        run: psql -v ON_ERROR_STOP=1 -q -f services/supabase/tests/ci-bootstrap.sql

      - name: Verify exact live-state migration classification
        run: python3 tools/audit/test_live_state_migration_policy.py

      # Replay every schema migration in production order. The six exact-name,
      # SHA-pinned live-state adoptions require historical jobs/config/function
      # metadata and are classified by the same policy as the local audit.
      - name: Apply schema migrations on a fresh database
        run: |
          python3 - <<'PY' > /tmp/rendprop-fresh-schema-migrations.txt
          from pathlib import Path
          from tools.audit.run_database_regression import partition_fresh_migrations
          schema, live_state = partition_fresh_migrations(sorted(Path('services/supabase/migrations').glob('*.sql')))
          for path in schema:
              print(path)
          PY
          for f in $(ls services/supabase/migrations/*.sql | LC_ALL=C sort); do
            if ! grep -Fxq "$f" /tmp/rendprop-fresh-schema-migrations.txt; then
              echo "== classified live-state adoption (source hash verified): $f"
              continue
            fi
            echo "== $f"
            if [ "$(basename "$f")" = '20261023191327_studio_internal_aerial_media_purpose_20261023.sql' ]; then
              python3 tools/audit/verify_aerial_media_purpose_guard.py "$f"
            fi
            psql -v ON_ERROR_STOP=1 -q -1 -f "$f"
          done

      # Test current writers here. Historical replay runs in the clean second
      # database below; old function bodies cannot be replayed over their newer
      # receipt-identity replacements on the final schema.
      - name: Durable video reflection jobs on the final schema
        run: |
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/video_erase.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/video_erase_direct_bria.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/legacy_photo_fallback.sql

      - name: Concurrent reflection receipts, cancellation and cost fences
        run: |
          createdb --template=rendprop erase_audit
          trap 'dropdb --if-exists erase_audit' EXIT
          python3 tools/audit/call-20260919/web/erase-concurrency.py psql -X --no-password -v ON_ERROR_STOP=1 -d erase_audit

      - name: Inclusive serving funds, Apple trial pool and finite reviewer authority
        run: |
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/funded_serving.sql
          # The bounded funded-trial walkthrough contract runs at its
          # historical schema point in bounded_subscription_trial_pg.py below.
          # limited_trial_creative_spend_pg.py covers current intro policy.
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/subscription_trial_purchase_reservations.sql
          # Trial-video duration allowed under the Oct 6 historical policy is
          # proven by subscription_trial_video_duration_pg.py below. The
          # current intro policy forbids trial video before payment.
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/modern_service_transport.sql
          # Current serving fixtures run on the final schema. The original
          # October 8 Free sample and publication slot contract is preserved
          # at its historical schema point by the disposable runner below.
          # October 8 Free-sample and publication-slot rules run at their
          # historical schema point in launch_blockers_pg.py below.
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/serving_grace.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/serving_settlement_identity.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/ops_deleted_workspace.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/private_library_adoption_safety.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/notification_session_fencing.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/reaudit_library_selection.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/reaudit_device_takeover.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/legacy_notification_sessions.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/reaudit_deleted_team_video.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/build57_db_controls.sql

      # The adversarial battery: privileged surface, grants, plan coherence
      # (enforced == published), lifecycle schema, and a mutating fixture that
      # exercises signup → publish → quota → chapters → leads → delete.
      - name: Invariants (all271 must pass)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/invariants.sql 2>&1 | tee /tmp/invariants.out
          grep -q 'All 271 invariants passed.' /tmp/invariants.out

      # Replay each historical version before a later migration replaces it.
      #0050's old overload is intentionally superseded by0051; applying0050
      #backwards onto the final schema is not a supported production sequence.
      - name: Replay migrations twice at their historical schema points
        env:
          PGDATABASE: rendprop_replay
        run: |
          createdb rendprop_replay
          psql -v ON_ERROR_STOP=1 -q -f services/supabase/tests/ci-bootstrap.sql
          # Use the same exact replay policy as the disposable runner. The
          # listed transactional Studio migrations still run once in EACH
          # fresh database; exact guarded one-shot migrations must refuse
          # their own second application for a pinned historical reason.
          python3 - <<'PY'
          from pathlib import Path
          from tools.audit.run_database_regression import GUARDED_ONE_SHOT_MIGRATIONS, replayable_migration
          paths = sorted(Path('services/supabase/migrations').glob('*.sql'))
          Path('/tmp/rendprop-replayable-migrations.txt').write_text(''.join(f'{path}\n' for path in paths if replayable_migration(path.name)))
          Path('/tmp/rendprop-guarded-one-shot-migrations.txt').write_text(''.join(f'{path}\n' for path in paths if path.name in GUARDED_ONE_SHOT_MIGRATIONS))
          PY
          for f in $(ls services/supabase/migrations/*.sql | LC_ALL=C sort); do
            if ! grep -Fxq "$f" /tmp/rendprop-fresh-schema-migrations.txt; then
              echo "== classified live-state adoption (source hash verified): $f"
              continue
            fi
            if [ "$(basename "$f")" = '20261023191327_studio_internal_aerial_media_purpose_20261023.sql' ]; then
              python3 tools/audit/verify_aerial_media_purpose_guard.py "$f"
            fi
            psql -v ON_ERROR_STOP=1 -q -1 -f "$f"
            if grep -Fxq "$f" /tmp/rendprop-guarded-one-shot-migrations.txt; then
              python3 tools/audit/verify_guarded_one_shot_refusal.py "$f"
            elif grep -Fxq "$f" /tmp/rendprop-replayable-migrations.txt; then
              psql -v ON_ERROR_STOP=1 -q -1 -f "$f"
            fi
          done
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/video_erase.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/video_erase_direct_bria.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/legacy_photo_fallback.sql
          # Run the same serving fixtures after the supported historical replay
          # reaches the final schema, including strict settlement and grace.
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/funded_serving.sql
          # The bounded funded-trial fixture runs in its disposable historical
          # schema runner below; the final schema has a stricter intro policy.
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/subscription_trial_purchase_reservations.sql
          # Keep trial-video duration in its historical-schema runner below.
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/modern_service_transport.sql
          # launch_blockers_pg.py preserves the October 8 contract on its
          # historical schema; limited_trial_creative_spend_pg.py tests today.
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/serving_grace.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/serving_settlement_identity.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/ops_deleted_workspace.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/private_library_adoption_safety.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/notification_session_fencing.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/reaudit_library_selection.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/reaudit_device_takeover.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/legacy_notification_sessions.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/reaudit_deleted_team_video.sql
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/build57_db_controls.sql

      - name: Invariants after the replay (all271 must pass)
        env:
          PGDATABASE: rendprop_replay
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f services/supabase/tests/invariants.sql 2>&1 | tee /tmp/invariants.out
          grep -q 'All 271 invariants passed.' /tmp/invariants.out

  db-publication-regression:
    name: Disposable PostgreSQL publication, invariant and deletion regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    # Do not reuse db-migrations' TCP service/database. Every runner below
    # owns its own initdb, a private Unix socket and database, verifies
    # identity, discards inherited PG credentials, and stops only its own
    # cluster. Every invariant must pass on fresh and replayed schemas; the
    # historical agent-reel headroom exception has been removed.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # run_deletion_handler_regression.py proves its test catches the
          # pre-0039 handler by checking that handler out of git history; a
          # depth-1 checkout does not have that commit.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Same exact pin as edge-functions; the handler and spatial edge
          # regressions run the real Deno test files offline.
          deno-version: "2.9.6"
      - name: Install explicit PostgreSQL 16 binaries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-client-16
          for tool in initdb pg_ctl psql createdb; do
            test -x "/usr/lib/postgresql/16/bin/$tool"
            pg_version=$("/usr/lib/postgresql/16/bin/$tool" --version)
            [[ "$pg_version" == "$tool (PostgreSQL) 16."* ]]
            printf '%s\n' "$pg_version"
          done
      # Some of the audit runners were written on a Mac and still open
      # /opt/homebrew/opt/postgresql@17/bin by absolute path. Give that path
      # the same PostgreSQL 16 tools as a symlink farm so they run unmodified
      # here; the runners that discover tools from PATH never touch it.
      - name: Provide the Homebrew postgresql@17 path the older runners hardcode
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/homebrew/opt/postgresql@17
          sudo ln -s /usr/lib/postgresql/16/bin /opt/homebrew/opt/postgresql@17/bin
          for tool in initdb pg_ctl psql createdb; do
            test -x "/opt/homebrew/opt/postgresql@17/bin/$tool"
          done
      - name: Run actual SQL fixtures, replay and deliberately broken guards
        id: database
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          python3 tools/audit/run_database_regression.py
      - name: Direct Bria reservations, stage admissions and cancellation races
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          python3 services/supabase/tests/video_erase_direct_bria_pg.py
      - name: Ordinary video priced admission, settlement and deletion races
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          python3 services/supabase/tests/app_video_cost_pg.py
      # The spatial edge regression runs --cached-only without preparing its
      # own cache (the deletion runners do), so fill the Deno cache with every
      # first-party edge module's pinned std/npm imports first. This is the
      # only step here that may reach the network for Deno.
      - name: Warm the Deno cache for the offline edge regressions
        shell: bash
        run: |
          set -euo pipefail
          deno install --no-config --no-lock --node-modules-dir=none --entrypoint \
            $(find services/supabase/functions -name '*.ts' -not -path '*/node_modules/*' | sort)
      # Deletion intent/spatial overlap, adoption recovery, spatial jobs,
      # provider journal, the real /me handler, the spatial edge handler and
      # the upload transport SQL — each against its own disposable cluster or
      # fixture doubles, never a shared or hosted database.
      - name: Deletion, adoption, spatial, handler and upload transport regressions
        id: fixtures
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          python3 tools/audit/test_privacy_receipt_fail_closed.py
          python3 tools/audit/run_deletion_integrity.py
          python3 tools/audit/run_deletion_regression.py --provider-commit "$GITHUB_SHA"
          python3 tools/audit/run_adoption_regression.py
          python3 tools/audit/run_team_readiness.py
          python3 tools/audit/run_subscription_trial_regression.py
          python3 tools/audit/run_subscription_chronology.py
          python3 tools/audit/test_workspace_handler_inventory.py --out "$RUNNER_TEMP/rendprop-workspace-inventory"
          python3 tools/audit/run_workspace_selection.py
          python3 tools/audit/run_team_private_libraries.py
          python3 tools/audit/run_account_library_safety.py
          python3 tools/audit/run_reaudit_database.py
          python3 tools/audit/run_legacy_notification_sessions.py
          python3 tools/audit/run_build57_db_controls.py
          python3 services/supabase/tests/run_build68_backend.py --evidence "$RUNNER_TEMP/build68-backend"
          python3 tools/audit/run_internal_testing_grants.py
          python3 tools/audit/run_private_internal_testing.py
          python3 services/supabase/tests/funded_serving_pg.py
          python3 services/supabase/tests/verified_retail_guest_pg.py
          python3 services/supabase/tests/subscription_trial_video_duration_pg.py
          python3 services/supabase/tests/subscription_trial_purchase_reservations_pg.py
          python3 services/supabase/tests/bounded_subscription_trial_pg.py
          python3 services/supabase/tests/limited_trial_creative_spend_pg.py --evidence-dir "$RUNNER_TEMP/rendprop-limited-trial-pg"
          python3 services/supabase/tests/serving_photo_partitions_pg.py
          python3 services/supabase/tests/launch_blockers_pg.py
          python3 services/supabase/tests/property_video_websites_pg.py
          python3 tools/audit/run_listing_gallery_selection.py
          python3 tools/audit/run_listing_measurement_cas.py
          python3 tools/audit/run_listing_facts_cas.py
          python3 tools/audit/run_brand_logo_regression.py
          python3 tools/audit/run_personal_card_regression.py
          python3 tools/audit/run_member_portfolio_regression.py
          python3 tools/audit/run_account_export.py
          python3 tools/audit/run_photographer_client_delivery.py
          python3 tools/audit/run_spatial_regression.py
          python3 tools/audit/run_spatial_provider_regression.py
          python3 tools/audit/run_deletion_handler_regression.py
          python3 tools/audit/run_spatial_edge_regression.py
          python3 tools/audit/test_upload_transport_db.py
          python3 services/supabase/tests/production_review.py
          python3 services/supabase/tests/presenter_workspace.py
          python3 services/supabase/tests/presenter_execution.py --controller
          python3 services/supabase/tests/prompt_library.py
          python3 tools/audit/run_studio_private_media.py
          python3 tools/audit/run_photo_authority.py
          python3 tools/audit/run_backend_billing_authority.py
          python3 tools/audit/run_verified_recipients.py
          python3 tools/audit/run_privacy_cleanup_inventory.py
          python3 tools/audit/run_upload_privacy_admission.py
          python3 tools/audit/run_bounded_media_delivery.py
      # A real red invariant suite still runs positive/negative publication
      # fixtures before exiting nonzero. Preserve its evidence, not a green
      # override. Preflight can fail before the runner creates any evidence.
      # Every runner above writes /tmp/rendprop-<fixture>-*/receipt.json.
      - name: Retain database receipts and logs, including failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: disposable-database-regression-${{ github.run_attempt }}
          path: |
            /tmp/rendprop-*/receipt.json
            /tmp/rendprop-*/*.log
            /tmp/rendprop-gallery-selection-*/*.json
            /tmp/rendprop-privacy-receipt-*/**/receipt.json
            /tmp/rendprop-privacy-receipt-*/**/*.log
            /tmp/rendprop-photographer-client-*/*.json
            ${{ runner.temp }}/rendprop-workspace-inventory/receipt.json
            build/pr-*/receipt.json
            build/pr-*/server.log
            build/pres-*/receipt.json
            build/pres-*/server.log
            build/pres-*/controller.log
            build/pex-*/receipt.json
            build/pex-*/controller.log
            build/pex-*/server.log
            build/prm-*/receipt.json
            build/prm-*/server.log
          retention-days: 7
          if-no-files-found: ${{ steps.database.outcome == 'success' && 'error' || 'warn' }}

  property-video-renderer:
    name: Private property video CPU and actual background authority
    runs-on: ubuntu-latest
