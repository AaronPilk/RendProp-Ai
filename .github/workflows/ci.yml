          node tests/listing-upload-order-browser.mjs
          node tests/listing-large-import-browser.mjs
          node tests/photo-recovery-browser.mjs
          node tests/photo-delivery-browser.mjs
          node tests/photo-output-browser.mjs
          node tests/photographer-browser.mjs
          node tests/business-browser.mjs
          node tests/industry-details-browser.mjs
          node tests/recovery-browser.mjs
          node --test ../../tools/deploy/check-migration-ledger.test.mjs
      - name: Exact processor permission preserves saved jobs and durable withdrawal
        timeout-minutes: 5
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/rendprop-processor-consent-browser"
          mkdir -p "$evidence_root"
          # The joint stop control removes both redundant safeguards; each
          # single omission is intentionally protected by the other safeguard.
          for control in positive unpublished-any404 journal-permission-omitted resume-without-local-allow v2-fal-downgrade revocation-no-durable-stop revocation-keeps-planning stop-join-and-confirmation-omitted; do
            control_root="$evidence_root/$control"
            mkdir -p "$control_root"
            set +e
            if [ "$control" = positive ]; then
              TMPDIR="$control_root" node tests/make-video-consent-browser.mjs > "$control_root/run.log" 2>&1
            else
              TMPDIR="$control_root" node tests/make-video-consent-browser.mjs --fault="$control" > "$control_root/run.log" 2>&1
            fi
            control_status=$?
            set -e
            if [ "$control" = positive ]; then
              if [ "$control_status" -ne 0 ]; then tail -n 60 "$control_root/run.log"; exit "$control_status"; fi
            else
              test "$control_status" -ne 0
            fi
            CONSENT_EVIDENCE="$control_root" CONSENT_CONTROL="$control" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,readdirSync} from 'node:fs';
          import {join} from 'node:path';
          const root=process.env.CONSENT_EVIDENCE,control=process.env.CONSENT_CONTROL;
          const folders=readdirSync(root,{withFileTypes:true}).filter(item=>item.isDirectory());
          assert.equal(folders.length,1);
          const receipt=JSON.parse(readFileSync(join(root,folders[0].name,'receipt.json'),'utf8'));
          assert.deepEqual(receipt.errors,[]);
          assert.deepEqual(receipt.externalRequests,[]);
          if(control==='positive'){
            assert.equal(receipt.status,'passed');assert.equal(receipt.fault,null);assert.equal(receipt.checks.length,13);
          }else{
            const expected={"unpublished-any404":{"failure":["Create video","Expected: disabled","Received: enabled"],"visible":null},"journal-permission-omitted":{"failure":["Current property video","Expected substring: \"queued\""],"visible":"Fixture processor consent/operation missing"},"resume-without-local-allow":{"failure":["Resume saved video","Expected: disabled","Received: enabled"],"visible":null},"v2-fal-downgrade":{"failure":["Resume saved video","element is not enabled"],"visible":null},"revocation-no-durable-stop":{"failure":["Expected substring: \"lost cancel reply\"","element(s) not found"],"visible":"Video work is stopped."},"revocation-keeps-planning":{"failure":["Revoke during planning never starts downstream voice","1 !== 0"],"visible":null},"stop-join-and-confirmation-omitted":{"failure":["Video work is stopped.","Expected: 0","Received: 1"],"visible":null}};
            assert.equal(receipt.status,'failed');assert.equal(receipt.fault,control);
            assert.ok(expected[control],'Unknown consent control');
            for(const text of expected[control].failure)assert.ok(receipt.failure.includes(text),control+': missing intended failure '+text);
            if(expected[control].visible)assert.ok(receipt.visibleText.includes(expected[control].visible));
          }
          NODE
