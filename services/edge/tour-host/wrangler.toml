name = "rendprop-tour-host"
main = "src/index.ts"
# Bumped from the stale 2024-09-23 (release-audit finding, 2026-09-07) — no
# compatibility_flags are set, so this date alone controls every default
# runtime behaviour. Verified as a no-op for this Worker: `npm test` (892
# assertions) passes unchanged at both dates, and a local `wrangler dev` at
# each date against the same requests (/, static assets, /f/*, /a/*, /terms)
# returned byte-identical status codes, headers and ETags. Re-verify the same
# way (or on a preview deploy) before pushing this date further.
compatibility_date = "2026-09-07"
# No *.workers.dev hostname in prod (duplicate content + un-branded URL) — the
# apex route below is the only public entry.
workers_dev = false
# src/spatial.ts ships Function.toString() of the spatial decoders to browsers;
# keepNames injects a `__name` helper that the served module doesn't have.
keep_names = false

# ---------------------------------------------------------------------------
# Routes — bind the public paths on the apex domain to this Worker.
# Requires rendprop.com to be an active zone on this Cloudflare account. The
# tour-host owns /f/*, /u/* (the MLS-unbranded twin), /a/*, and the legal pages
# (/terms, /privacy — linked from the iOS app's Settings); the marketing site
# keeps everything else.
# ---------------------------------------------------------------------------
# Catch-all: the Worker owns the whole apex (serves the landing page at /,
# tours at /f/*, MLS-unbranded tours at /u/*, portfolios at /a/*, and the legal
# pages). Without this, any un-routed path (like the bare domain) falls through
# to the placeholder DNS record and 525s.
routes = [
  { pattern = "rendprop.com/*", zone_name = "rendprop.com" },
  # www is a proxied DNS record in the same zone but had no route, so every
  # www.rendprop.com URL answered Cloudflare's 525 page (verified live
  # 2026-09-05). With the route, the Worker 301s its own paths to the apex
  # (src/index.ts canonicalRedirect) and the static pages simply serve; a
  # zone-level "Redirect from WWW to root" rule makes those a 301 as well.
  { pattern = "www.rendprop.com/*", zone_name = "rendprop.com" },
]

# ---------------------------------------------------------------------------
# Static assets — the marketing site. Requests that exactly match a file in
# ./public (/, /assets/*, /favicon.svg, /robots.txt, /sitemap.xml) are served
# directly from the edge; everything else (e.g. /f/*, /a/*, /terms, /privacy)
# falls through to the Worker script.
# ---------------------------------------------------------------------------
[assets]
directory = "./public"

[vars]
# Base URL of the Supabase Edge Functions (no trailing slash needed).
SUPABASE_FUNCTIONS_URL = "https://ymgqpbnjpztwjsyvceld.supabase.co/functions/v1"

# Supabase anon (publishable) key. This is PUBLIC by design — RLS enforces
# access and it already ships in every Supabase client. It's the apikey/Bearer
# on the server->tours read and on the browser's lead/beacon calls.
#
# Set it as a SECRET (do NOT uncomment a plaintext var here):
#   npx wrangler secret put SUPABASE_ANON_KEY
# A [vars] entry with the same name SHADOWS the secret on every deploy —
# leaving a placeholder here would silently break all upstream calls with 401s.
# SUPABASE_ANON_KEY = "(set via: wrangler secret put SUPABASE_ANON_KEY)"

# Optional: edge cache TTL (seconds) for synthetic demo tour HTML only.
# Customer tour/portfolio HTML always bypasses cache and returns no-store.
# 0 disables new demo cache writes. Default is 60 when unset.
TOUR_CACHE_TTL = "60"

# Cloudflare Turnstile SITE key (PUBLIC — safe to commit). When set, the tour
# lead form renders the Turnstile widget. Create a widget at
# Cloudflare dash → Turnstile, then paste the site key here and set the matching
# SECRET on the Supabase leads function:
#   npx supabase secrets set TURNSTILE_SECRET_KEY=<secret>   (or the dashboard)
# Both must be set to activate bot protection; until then it's a no-op.
TURNSTILE_SITE_KEY = "0x4AAAAAAErjjtep0GvXjQxs"

[observability]
enabled = true
